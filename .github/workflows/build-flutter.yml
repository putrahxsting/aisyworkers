# ═══════════════════════════════════════════════════════════════════════════════
#  build-flutter.yml  —  Build APK universal untuk bot Telegram
#  Mendukung: Flutter (semua versi stable), Android Native (Gradle), Web → APK
#
#  Taruh di worker repo sebagai  .github/workflows/build-flutter.yml
#  (salin juga sebagai build-android.yml bila bot memakai slot workflow Android).
#
#  Kontrak dengan bot (server.js → triggerWorkflow):
#    inputs : jobId, userId, payload (JSON)
#    payload: mode=zip  → {url, buildType, perfMode, engine, tag}
#             mode=url  → {url, appName, iconUrl}   (Web → APK)
#    hasil  : artifact  apk-<jobId>   (berisi app-<tipe>.apk)
#    gagal  : artifact  diag-<jobId>  (log lengkap, ringkasan error, config, laporan Gradle)
#             + anotasi ::error di log job (dibaca bot lewat getFailedStepLog)
#
#  Otomatis (tanpa isi manual):
#    Flutter : versi dipilih dari .fvmrc / pubspec (sdk & flutter) memakai manifest rilis resmi;
#              cadangan: SDK seangkatan bila build pertama gagal
#    JDK     : 8 / 11 / 17 / 21 / 25 dari versi Gradle, AGP, toolchain, dan plugin
#    Gradle  : wrapper project; bila tidak ada, dipilih dari versi AGP
#    SDK/NDK : compileSdk, build-tools, NDK, CMake dibaca dari project + plugin Flutter lalu dipasang
#    Tambalan: gradlew CRLF, org.gradle.java.home milik PC lain, key.properties hilang, namespace
#              modul lama, AndroidX, local.properties, APK unsigned → ditandatangani
#  Override opsional di payload: flutterVersion, javaVersion, gradleVersion, ndkVersion,
#    compileSdk, buildTools, flavor, packageName, versionName
# ═══════════════════════════════════════════════════════════════════════════════
name: Build APK (Flutter • Android Native • Web2APK)
run-name: "Build ${{ inputs.jobId }}"

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "ID job dari bot"
        required: true
        type: string
      userId:
        description: "ID Telegram pengguna"
        required: false
        default: "0"
        type: string
      payload:
        description: "JSON konfigurasi build (dibuat bot)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.jobId }}
  cancel-in-progress: false

env:
  JOB_ID: ${{ inputs.jobId }}
  USER_ID: ${{ inputs.userId }}
  CI: "true"
  PUB_ENVIRONMENT: "bot_ci"
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: build-${{ inputs.jobId }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: "1a · Skrip bantu: deteksi & tambal project"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci" "$GITHUB_WORKSPACE/_diag" "$HOME/.android"
          cat > "$RUNNER_TEMP/ci/payload.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """payload.py - validasi payload dispatch dari bot -> variabel lingkungan untuk step berikutnya.

          Kontrak dengan bot (server.js):
            zip : {mode:"zip", url, buildType, perfMode, engine, tag}
            url : {mode:"url", url, appName, iconUrl}
          Opsional (override manual): flutterVersion, javaVersion, gradleVersion, ndkVersion, compileSdk,
            buildTools, flavor, packageName, versionName
          """
          import json, os, re, sys

          WS = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          raw = os.environ.get("PAYLOAD", "")


          def die(msg):
              print(f"::error title=Payload tidak valid::{msg}")
              sys.exit(1)


          try:
              p = json.loads(raw) if raw.strip() else {}
          except Exception as e:  # noqa
              die(f"JSON payload rusak ({e}). Isi (80 karakter pertama): {raw[:80]!r}")
          if not isinstance(p, dict):
              die("Payload harus berupa objek JSON.")


          def s(key, default=""):
              v = p.get(key, default)
              return default if v is None else re.sub(r"[\r\n]+", " ", str(v)).strip()


          url = s("url")
          mode = s("mode").lower()
          if mode not in ("zip", "url"):
              mode = "url" if (s("appName") and not url.lower().split("?")[0].endswith(".zip")) else "zip"
          if not url:
              die("Field 'url' kosong. Bot harus mengirim link ZIP source (mode zip) atau alamat website (mode url).")

          build_type = s("buildType", "release").lower()
          if build_type not in ("debug", "release"):
              build_type = "release"
          perf = s("perfMode", "fast").lower()
          if perf not in ("fast", "low"):
              perf = "fast"
          engine = s("engine", "auto").lower()
          if engine not in ("flutter", "native"):
              engine = "auto"

          env = {
              "BUILD_MODE": mode, "SRC_URL": url, "BUILD_TYPE": build_type, "PERF_MODE": perf, "ENGINE_HINT": engine,
              "APP_NAME": s("appName", "Web App"), "ICON_URL": s("iconUrl"), "PKG_NAME": s("packageName"),
              "VERSION_NAME": s("versionName", "1.0"), "TAG": s("tag"),
              "OVR_FLUTTER": s("flutterVersion"), "OVR_JAVA": s("javaVersion"), "OVR_GRADLE": s("gradleVersion"),
              "OVR_NDK": s("ndkVersion"), "OVR_COMPILE_SDK": s("compileSdk"), "OVR_BUILD_TOOLS": s("buildTools"),
              "OVR_FLAVOR": s("flavor"),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for k, v in env.items():
                  f.write(f"{k}={v}\n")
          for k in ("BUILD_MODE", "BUILD_TYPE", "PERF_MODE", "ENGINE_HINT", "APP_NAME"):
              print(f"  {k} = {env[k]}")
          print(f"  SRC_URL = {url[:90]}{'...' if len(url) > 90 else ''}")

          # ringkasan awal
          summ = os.environ.get("GITHUB_STEP_SUMMARY")
          if summ:
              with open(summ, "a", encoding="utf-8") as f:
                  f.write(f"### Build `{os.environ.get('JOB_ID', '-')}`\n\n| Item | Nilai |\n|---|---|\n"
                          f"| Mode | `{mode}` |\n| Tipe | `{build_type}` |\n| Profil | `{perf}` |\n| Engine (permintaan) | `{engine}` |\n")
          __CI_EOF__
          cat > "$RUNNER_TEMP/ci/detect.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """detect.py - deteksi project & toolchain untuk workflow build (Flutter / Android native / Web2APK).

          Subcommand:
            locate     cari root project di _extract -> pindah ke ./project, tentukan engine
            toolchain  tentukan versi Flutter, JDK, Gradle, compileSdk, build-tools, NDK, CMake, flavor
            plugins    (setelah flutter pub get) baca kebutuhan SDK/NDK dari plugin + default Flutter SDK
          """
          import json, os, re, shutil, sys, urllib.request

          WS = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          PROJECT = os.path.join(WS, "project")
          EXTRACT = os.path.join(WS, "_extract")
          TC_JSON = os.path.join(WS, "_diag", "toolchain.json")
          SKIP_DIRS = {"build", ".gradle", "node_modules", ".dart_tool", ".git", "__MACOSX", ".idea", "ios", "macos",
                       "windows", "linux", "web", ".pub-cache", "Pods", ".fvm"}


          # ───────────────────────── util output ─────────────────────────
          def _append(path, text):
              if path:
                  with open(path, "a", encoding="utf-8") as f:
                      f.write(text)


          def out(k, v):
              v = "" if v is None else str(v).replace("\n", " ")
              _append(os.environ.get("GITHUB_OUTPUT"), f"{k}={v}\n")
              print(f"  {k} = {v}")


          def setenv(k, v):
              v = "" if v is None else str(v).replace("\n", " ")
              _append(os.environ.get("GITHUB_ENV"), f"{k}={v}\n")


          def notice(msg): print(f"::notice::{msg}")
          def warn(msg): print(f"::warning::{msg}")
          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)


          def read(path, limit=2_000_000):
              try:
                  if os.path.getsize(path) > limit:
                      return ""
                  with open(path, "r", encoding="utf-8", errors="replace") as f:
                      return f.read()
              except OSError:
                  return ""


          # ───────────────────────── versi & constraint ─────────────────────────
          def vparse(s):
              m = re.match(r"\s*v?(\d+)(?:\.(\d+))?(?:\.(\d+))?", str(s or ""))
              if not m:
                  return None
              return tuple(int(x) if x is not None else 0 for x in m.groups())


          def vstr(t):
              return ".".join(str(x) for x in t)


          def parse_constraint(s):
              """Dukung: ^1.2.3, >=1 <2, >=1, <2, <=, >, ==, versi tunggal, any. Return list[(op, tuple)]"""
              s = (s or "").strip().strip("'\"")
              if not s or s.lower() in ("any", "*"):
                  return []
              cons = []
              for tok in re.findall(r"(\^|>=|<=|==|>|<|=)?\s*v?(\d+(?:\.\d+){0,2})(?:-[\w.+-]+)?", s):
                  op, ver = tok
                  v = vparse(ver)
                  if not v:
                      continue
                  if op == "^":
                      cons.append((">=", v))
                      if v[0] > 0:
                          cons.append(("<", (v[0] + 1, 0, 0)))
                      elif v[1] > 0:
                          cons.append(("<", (0, v[1] + 1, 0)))
                      else:
                          cons.append(("<", (0, 0, v[2] + 1)))
                  elif op in ("", None):
                      cons.append(("==", v))
                  else:
                      cons.append(("==" if op == "=" else op, v))
              return cons


          def satisfies(v, cons):
              for op, c in cons:
                  if op == ">=" and not v >= c: return False
                  if op == ">" and not v > c: return False
                  if op == "<=" and not v <= c: return False
                  if op == "<" and not v < c: return False
                  if op == "==" and not v == c: return False
              return True


          def lower_bound(cons):
              lows = [c for op, c in cons if op in (">=", ">", "==")]
              return max(lows) if lows else None


          # ───────────────────────── baca project ─────────────────────────
          def walk_files(root, exts=None, names=None, max_files=600):
              n = 0
              for dp, dns, fns in os.walk(root):
                  dns[:] = [d for d in dns if d not in SKIP_DIRS and not d.startswith(".")]
                  for fn in fns:
                      ok = (names and fn in names) or (exts and any(fn.endswith(e) for e in exts))
                      if ok:
                          n += 1
                          if n > max_files:
                              return
                          yield os.path.join(dp, fn)


          def gradle_files(root):
              return list(walk_files(root, exts=(".gradle", ".gradle.kts", ".toml"),
                                     names=("gradle.properties", "gradle-wrapper.properties")))


          def pubspec_env(text):
              """Ambil environment.sdk & environment.flutter tanpa PyYAML."""
              res = {"sdk": "", "flutter": ""}
              lines = text.splitlines()
              for i, ln in enumerate(lines):
                  if re.match(r"^environment\s*:\s*$", ln):
                      for nxt in lines[i + 1:]:
                          if nxt.strip() == "" or nxt.lstrip().startswith("#"):
                              continue
                          if not nxt.startswith((" ", "\t")):
                              break
                          m = re.match(r"\s+(sdk|flutter)\s*:\s*(.+?)\s*(?:#.*)?$", nxt)
                          if m:
                              res[m.group(1)] = m.group(2).strip().strip("'\"")
                      break
              return res


          def is_flutter_pubspec(text):
              return bool(re.search(r"^\s*sdk\s*:\s*flutter\s*$", text, re.M) or re.search(r"^flutter\s*:", text, re.M))


          def scan_gradle_text(text, acc):
              for m in re.finditer(r"compileSdk(?:Version)?\s*(?:=|\(|\s)\s*(?:release\()?\s*(\d{2})\b", text):
                  acc["compile"].add(int(m.group(1)))
              for m in re.finditer(r"release\((\d{2})\)", text):
                  acc["compile"].add(int(m.group(1)))
              for m in re.finditer(r"buildToolsVersion\s*(?:=|\()?\s*[\"'](\d+(?:\.\d+){1,3})[\"']", text):
                  acc["tools"].add(m.group(1))
              for m in re.finditer(r"ndkVersion\s*(?:=|\()?\s*[\"'](\d+(?:\.\d+){1,3})[\"']", text):
                  acc["ndk"].add(m.group(1))
              for m in re.finditer(r"cmake\s*\{[^{}]*?version\s*(?:=)?\s*[\"'](\d+(?:\.\d+){1,3})[\"']", text, re.S):
                  acc["cmake"].add(m.group(1))
              if re.search(r"externalNativeBuild|ndkBuild|CMakeLists", text):
                  acc["native_code"] = True
              # JDK yang dibutuhkan toolchain/target
              for m in re.finditer(r"jvmToolchain\s*\(\s*(\d+)\s*\)", text):
                  acc["jdk_req"].add(int(m.group(1)))
              for m in re.finditer(r"JavaLanguageVersion\.of\(\s*(\d+)\s*\)", text):
                  acc["jdk_req"].add(int(m.group(1)))
              for m in re.finditer(r"JavaVersion\.VERSION_(\d+)(?:_(\d+))?", text):
                  a, b = m.group(1), m.group(2)
                  acc["jdk_req"].add(int(b) if a == "1" and b else int(a))
              for m in re.finditer(r"jvmTarget\s*=?\s*[\"'](?:1\.)?(\d+)[\"']", text):
                  acc["jdk_req"].add(int(m.group(1)))
              # AGP
              for m in re.finditer(r"com\.android\.tools\.build:gradle:(\d+\.\d+(?:\.\d+)?)", text):
                  acc["agp"].add(m.group(1))
              for m in re.finditer(r"[\"']com\.android\.(?:application|library)[\"']\s*\)?\s*version\s*\(?\s*[\"'](\d+\.\d+(?:\.\d+)?)", text):
                  acc["agp"].add(m.group(1))
              for m in re.finditer(r"^\s*(?:agp|androidGradlePlugin|android-gradle-plugin|android_gradle_plugin)\s*=\s*[\"'](\d+\.\d+(?:\.\d+)?)", text, re.M):
                  acc["agp"].add(m.group(1))
              for m in re.finditer(r"kotlin[_-]?version\s*=\s*[\"'](\d+\.\d+(?:\.\d+)?)[\"']", text, re.I):
                  acc["kotlin"].add(m.group(1))
              for m in re.finditer(r"org\.jetbrains\.kotlin\.android[\"']\s*\)?\s*version\s*\(?\s*[\"'](\d+\.\d+(?:\.\d+)?)", text):
                  acc["kotlin"].add(m.group(1))
              for m in re.finditer(r"^\s*kotlin\s*=\s*[\"'](\d+\.\d+(?:\.\d+)?)[\"']", text, re.M):
                  acc["kotlin"].add(m.group(1))
              m = re.search(r"distributionUrl\s*=.*?gradle-(\d+(?:\.\d+){1,2})(?:-rc-\d+)?-(?:bin|all)\.zip", text)
              if m:
                  acc["gradle_wrap"].add(m.group(1))


          def new_acc():
              return {"compile": set(), "tools": set(), "ndk": set(), "cmake": set(), "jdk_req": set(), "agp": set(),
                      "kotlin": set(), "gradle_wrap": set(), "native_code": False}


          def scan_project(root):
              acc = new_acc()
              for f in gradle_files(root):
                  scan_gradle_text(read(f), acc)
              return acc


          def vmax(items):
              best = None
              for it in items:
                  p = vparse(it)
                  if p and (best is None or p > best[0]):
                      best = (p, it)
              return best[1] if best else ""


          # ───────────────────────── Flutter version resolver ─────────────────────────
          MANIFEST_URL = "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json"
          # cadangan offline (Dart minor -> deret Flutter stable); dipakai kalau manifest tidak bisa diunduh
          FALLBACK_BY_DART = {
              (2, 12): "2.0.x", (2, 13): "2.2.x", (2, 14): "2.5.x", (2, 15): "2.8.x", (2, 16): "2.10.x", (2, 17): "3.0.x",
              (2, 18): "3.3.x", (2, 19): "3.7.x", (3, 0): "3.10.x", (3, 1): "3.13.x", (3, 2): "3.16.x", (3, 3): "3.19.x",
              (3, 4): "3.22.x", (3, 5): "3.24.x", (3, 6): "3.27.x", (3, 7): "3.29.x", (3, 8): "3.32.x",
          }


          def load_releases():
              path = os.environ.get("FLUTTER_RELEASES_JSON")
              try:
                  if path and os.path.exists(path):
                      data = json.load(open(path, encoding="utf-8"))
                  else:
                      req = urllib.request.Request(MANIFEST_URL, headers={"User-Agent": "build-workflow"})
                      data = json.load(urllib.request.urlopen(req, timeout=25))
              except Exception as e:  # noqa
                  warn(f"Manifest rilis Flutter tidak bisa diambil ({e}); memakai tabel cadangan.")
                  return []
              rels = []
              for r in data.get("releases", []):
                  if r.get("channel") != "stable":
                      continue
                  fv, dv = vparse(r.get("version")), vparse(str(r.get("dart_sdk_version") or "").split(" ")[0])
                  if fv and dv:
                      rels.append((fv, dv))
              rels = sorted(set(rels))
              return rels


          def resolve_flutter(project, ovr):
              """Return (primary, alt, channel, source)"""
              # 1) override eksplisit
              if ovr:
                  o = str(ovr).strip()
                  if o in ("stable", "beta", "master", "dev"):
                      return "", "", o, "payload"
                  return o.lstrip("v"), "", "stable", "payload"
              # 2) FVM / asdf
              for fn, pat in ((".fvmrc", r'"flutter"\s*:\s*"([^"]+)"'), (os.path.join(".fvm", "fvm_config.json"), r'"flutterSdkVersion"\s*:\s*"([^"]+)"'),
                              (".tool-versions", r"^\s*flutter\s+([\w.\-]+)")):
                  m = re.search(pat, read(os.path.join(project, fn)), re.M)
                  if m:
                      v = m.group(1).split("@")[-1].replace("-stable", "").strip()
                      if v in ("stable", "beta", "master", "dev"):
                          return "", "", v, fn
                      if vparse(v):
                          return v.lstrip("v"), "", "stable", fn
              # 3) constraint pubspec
              pub = read(os.path.join(project, "pubspec.yaml"))
              env = pubspec_env(pub)
              dcons, fcons = parse_constraint(env["sdk"]), parse_constraint(env["flutter"])
              has_lock = os.path.exists(os.path.join(project, "pubspec.lock"))
              if not dcons and not fcons:
                  return "", "", "stable", "tidak ada constraint -> stable terbaru"
              rels = load_releases()
              if not rels:
                  low = lower_bound(dcons)
                  alt = FALLBACK_BY_DART.get((low[0], low[1])) if low else None
                  if alt and low and low[:2] <= (3, 8):
                      return alt, "", "stable", "tabel cadangan"
                  return "", "", "stable", "tabel cadangan -> stable terbaru"
              ok = [(f, d) for f, d in rels if satisfies(d, dcons) and satisfies(f, fcons)]
              if not ok:
                  warn(f"Tidak ada Flutter stable yang cocok dengan sdk '{env['sdk']}' / flutter '{env['flutter']}'; memakai stable terbaru.")
                  return "", "", "stable", "constraint tidak terpenuhi"
              newest = max(ok)[0]
              low = lower_bound(dcons)
              era = None
              if low:
                  same = [f for f, d in ok if d[:2] == low[:2]]
                  era = max(same) if same else min(f for f, _ in ok)
              primary, alt = newest, era
              if has_lock and era:
                  primary, alt = era, newest  # pubspec.lock = paket terkunci, lebih aman pakai SDK seangkatan
              alt = alt if alt and alt != primary else None
              return vstr(primary), (vstr(alt) if alt else ""), "stable", f"constraint sdk '{env['sdk']}'"


          # ───────────────────────── JDK & Gradle ─────────────────────────
          JDK_LTS = [8, 11, 17, 21, 25]


          def snap_jdk(n):
              for j in JDK_LTS:
                  if n <= j:
                      return j
              return JDK_LTS[-1]


          def choose_java(gradle_ver, agp_ver, jdk_req, flutter_ver, override):
              if override and str(override).strip().isdigit():
                  return snap_jdk(int(override))
              need = 8
              g = vparse(gradle_ver)
              if g:
                  if g >= (8, 0, 0): need = max(need, 17)
                  elif g >= (6, 0, 0): need = max(need, 11)
              a = vparse(agp_ver)
              if a:
                  if a >= (8, 0, 0): need = max(need, 17)
                  elif a >= (7, 0, 0): need = max(need, 11)
              f = vparse(flutter_ver)
              if f and f >= (3, 16, 0) and not g and not a:
                  need = max(need, 17)
              elif f and f >= (3, 7, 0) and not g and not a:
                  need = max(need, 11)
              if jdk_req:
                  need = max(need, max(jdk_req))
              if not g and not a and not f:
                  need = max(need, 17)
              return snap_jdk(need)


          AGP_TO_GRADLE = [  # (agp minimal, gradle yang dipakai kalau tidak ada wrapper)
              ((9, 0), "9.1.0"), ((8, 13), "8.13"), ((8, 12), "8.13"), ((8, 11), "8.13"), ((8, 10), "8.11.1"), ((8, 9), "8.11.1"),
              ((8, 8), "8.10.2"), ((8, 7), "8.9"), ((8, 6), "8.7"), ((8, 5), "8.7"), ((8, 4), "8.6"), ((8, 3), "8.4"),
              ((8, 2), "8.2"), ((8, 1), "8.0"), ((8, 0), "8.0"), ((7, 4), "7.5"), ((7, 3), "7.4"), ((7, 2), "7.3.3"),
              ((7, 1), "7.2"), ((7, 0), "7.0.2"), ((4, 2), "6.7.1"), ((4, 1), "6.5.1"), ((4, 0), "6.1.1"), ((3, 6), "5.6.4"),
              ((3, 5), "5.4.1"), ((3, 4), "5.1.1"), ((3, 3), "4.10.1"), ((3, 2), "4.6"), ((3, 1), "4.4"), ((3, 0), "4.1"),
          ]


          def gradle_for_agp(agp):
              a = vparse(agp)
              if not a:
                  return "8.14"
              for mn, g in AGP_TO_GRADLE:
                  if a[:2] >= mn:
                      return g
              return "4.1"


          # ───────────────────────── modul Android native ─────────────────────────
          APP_PLUGIN_RE = re.compile(r"com\.android\.application|android\.application|com\.android\.library.*application", re.I)


          def find_app_module(root):
              settings = ""
              for fn in ("settings.gradle", "settings.gradle.kts"):
                  settings = read(os.path.join(root, fn))
                  if settings:
                      break
              mods = []
              for m in re.finditer(r"include\s*\(?([^\n]+)", settings):
                  for q in re.findall(r"[\"']([^\"']+)[\"']", m.group(1)):
                      mods.append(q.lstrip(":"))
              cands = []
              for mod in mods:
                  d = os.path.join(root, *mod.split(":"))
                  for fn in ("build.gradle", "build.gradle.kts"):
                      txt = read(os.path.join(d, fn))
                      if txt and APP_PLUGIN_RE.search(txt):
                          cands.append(mod)
                          break
              if cands:
                  cands.sort(key=lambda m: (m != "app", len(m)))
                  return cands[0]
              for fn in ("build.gradle", "build.gradle.kts"):
                  if APP_PLUGIN_RE.search(read(os.path.join(root, fn))):
                      return ""
              return "app" if os.path.isdir(os.path.join(root, "app")) else ""


          def find_flavors(gradle_text):
              """Nama flavor dari blok productFlavors (satu dimensi)."""
              m = re.search(r"productFlavors\s*\{", gradle_text)
              if not m:
                  return [], 0
              dims = len(re.findall(r"flavorDimensions", gradle_text))
              i, depth, start = m.end(), 1, m.end()
              while i < len(gradle_text) and depth:
                  depth += {"{": 1, "}": -1}.get(gradle_text[i], 0)
                  i += 1
              block = gradle_text[start:i - 1]
              names, d, cur = [], 0, ""
              for line in block.splitlines():
                  if d == 0:
                      mm = re.match(r"\s*(?:create|register|maybeCreate)?\s*\(?[\"']?(\w+)[\"']?\)?\s*\{", line)
                      if mm:
                          names.append(mm.group(1))
                  d += line.count("{") - line.count("}")
              return [n for n in names if n not in ("dimension",)], dims


          # ───────────────────────── subcommand: locate ─────────────────────────
          def cmd_locate():
              hint = os.environ.get("ENGINE_HINT", "auto")
              if not os.path.isdir(EXTRACT):
                  fail("Folder hasil ekstrak tidak ada.")
              found = []
              for dp, dns, fns in os.walk(EXTRACT):
                  depth = dp[len(EXTRACT):].count(os.sep)
                  dns[:] = [d for d in dns if d not in SKIP_DIRS and not d.startswith(".")]
                  if depth > 4:
                      dns[:] = []
                  names = set(fns)
                  if "pubspec.yaml" in names and is_flutter_pubspec(read(os.path.join(dp, "pubspec.yaml"))):
                      found.append((depth, 0, dp, "flutter"))
                  if names & {"settings.gradle", "settings.gradle.kts"}:
                      found.append((depth, 1, dp, "native"))
              if not found:
                  listing = ", ".join(sorted(os.listdir(EXTRACT))[:15])
                  fail("Project tidak ditemukan di ZIP. Harus ada pubspec.yaml (Flutter) atau settings.gradle (Android native). "
                       f"Isi ZIP: {listing or '(kosong)'}")
              # Flutter menyimpan android/settings.gradle di dalam project; ambil yang paling dangkal.
              flutter = [f for f in found if f[3] == "flutter"]
              native = [f for f in found if f[3] == "native"]
              pick = None
              if hint == "native" and native:
                  pick = min(native)
              elif hint == "flutter" and flutter:
                  pick = min(flutter)
              elif flutter and native:
                  pick = min(flutter + native, key=lambda x: (x[0], x[1]))
                  # settings.gradle milik folder android/ dari project Flutter bukan project native
                  if pick[3] == "native" and os.path.basename(pick[2]) == "android" and flutter:
                      pick = min(flutter)
              else:
                  pick = min(flutter or native)
              engine = pick[3]
              if hint in ("flutter", "native") and hint != engine:
                  warn(f"Mode '{hint}' diminta, tetapi isi ZIP adalah project {engine}. Memakai {engine}.")
              if os.path.isdir(PROJECT):
                  shutil.rmtree(PROJECT)
              shutil.move(pick[2], PROJECT)
              shutil.rmtree(EXTRACT, ignore_errors=True)
              print(f"Project {engine} ditemukan (kedalaman {pick[0]}).")
              out("engine", engine)
              setenv("ENGINE", engine)
              if engine == "flutter":
                  need_create = not os.path.isdir(os.path.join(PROJECT, "android"))
                  out("flutter_create", "true" if need_create else "false")
                  if need_create:
                      notice("Folder android/ tidak ada di ZIP: akan dibuat dengan 'flutter create --platforms=android'.")


          # ───────────────────────── subcommand: toolchain ─────────────────────────
          def cmd_toolchain():
              engine = os.environ.get("ENGINE", "native")
              ovr = {k: os.environ.get(k, "").strip() for k in ("OVR_FLUTTER", "OVR_JAVA", "OVR_GRADLE", "OVR_NDK", "OVR_COMPILE_SDK", "OVR_BUILD_TOOLS", "OVR_FLAVOR")}
              acc = scan_project(PROJECT)
              if ovr["OVR_COMPILE_SDK"].isdigit():
                  acc["compile"].add(int(ovr["OVR_COMPILE_SDK"]))
              if ovr["OVR_NDK"]:
                  acc["ndk"].add(ovr["OVR_NDK"])
              if ovr["OVR_BUILD_TOOLS"]:
                  acc["tools"].add(ovr["OVR_BUILD_TOOLS"])

              flutter_v = flutter_alt = ""
              channel, src = "stable", ""
              if engine == "flutter":
                  flutter_v, flutter_alt, channel, src = resolve_flutter(PROJECT, ovr["OVR_FLUTTER"])
                  print(f"Flutter: {flutter_v or channel} (alt: {flutter_alt or '-'}) <- {src}")

              wrapper = os.path.join(PROJECT, "android" if engine == "flutter" else "", "gradlew")
              if engine == "native":
                  # root project native bisa berada di PROJECT langsung
                  wrapper = os.path.join(PROJECT, "gradlew")
              has_wrapper = os.path.exists(wrapper)
              gradle_wrap = vmax(acc["gradle_wrap"])
              agp = vmax(acc["agp"])
              gradle_for_java = gradle_wrap or (gradle_for_agp(agp) if agp else "")
              java = choose_java(gradle_for_java, agp, acc["jdk_req"], flutter_v or flutter_alt, ovr["OVR_JAVA"])
              gradle_ver = ovr["OVR_GRADLE"] or ("" if has_wrapper else gradle_for_agp(agp))

              flavor = ovr["OVR_FLAVOR"]
              if engine == "flutter" and not flavor:
                  for fn in ("build.gradle", "build.gradle.kts"):
                      names, dims = find_flavors(read(os.path.join(PROJECT, "android", "app", fn)))
                      if names:
                          if dims > 1:
                              warn("Project memakai lebih dari satu flavorDimensions; flavor tidak dipilih otomatis (kirim payload.flavor).")
                          else:
                              flavor = names[0]
                              notice(f"Flavor terdeteksi: {', '.join(names)} -> memakai '{flavor}'.")
                          break

              app_module = find_app_module(PROJECT) if engine == "native" else "app"
              tc = {
                  "engine": engine, "flutter": flutter_v, "flutter_alt": flutter_alt, "channel": channel, "java": java,
                  "gradle": gradle_ver, "has_wrapper": has_wrapper, "agp": agp, "kotlin": vmax(acc["kotlin"]),
                  "compile": sorted(acc["compile"]), "tools": sorted(acc["tools"]), "ndk": sorted(acc["ndk"]),
                  "cmake": sorted(acc["cmake"]), "native_code": acc["native_code"], "flavor": flavor,
                  "app_module": app_module, "gradle_wrapper_version": gradle_wrap,
              }
              os.makedirs(os.path.dirname(TC_JSON), exist_ok=True)
              json.dump(tc, open(TC_JSON, "w", encoding="utf-8"), indent=2)
              print("::group::Hasil deteksi toolchain")
              print(json.dumps(tc, indent=2))
              print("::endgroup::")
              for k in ("flutter", "flutter_alt", "channel", "java", "gradle", "flavor", "app_module"):
                  out(k, tc[k])
              out("has_wrapper", "true" if has_wrapper else "false")
              out("agp", agp)
              out("gradle_wrapper_version", gradle_wrap)
              out("flutter_selector", flutter_v or "")  # versi eksak untuk flutter-action ('' = channel terbaru)
              out("compile_sdks", ",".join(map(str, tc["compile"])))


          # ───────────────────────── subcommand: plugins ─────────────────────────
          def cmd_plugins():
              tc = json.load(open(TC_JSON, encoding="utf-8"))
              acc = new_acc()
              acc["compile"].update(tc.get("compile", []))
              acc["tools"].update(tc.get("tools", []))
              acc["ndk"].update(tc.get("ndk", []))
              acc["cmake"].update(tc.get("cmake", []))
              jdk_req = set()
              # default Flutter SDK (flutter.compileSdkVersion / flutter.ndkVersion)
              froot = os.environ.get("FLUTTER_ROOT") or ""
              if not froot:
                  import shutil as sh
                  fb = sh.which("flutter")
                  froot = os.path.dirname(os.path.dirname(os.path.realpath(fb))) if fb else ""
              gdir = os.path.join(froot, "packages", "flutter_tools", "gradle", "src", "main")
              uses_flutter_default = False
              app_gradle = read(os.path.join(PROJECT, "android", "app", "build.gradle")) + read(os.path.join(PROJECT, "android", "app", "build.gradle.kts"))
              if re.search(r"flutter\.compileSdkVersion|flutter\.compileSdk\b", app_gradle) or not acc["compile"]:
                  uses_flutter_default = True
              if os.path.isdir(gdir):
                  for f in walk_files(gdir, exts=(".groovy", ".kt", ".gradle", ".kts")):
                      t = read(f)
                      if uses_flutter_default:
                          for m in re.finditer(r"compileSdkVersion\s*(?::\s*Int\s*)?=\s*(\d{2})", t):
                              acc["compile"].add(int(m.group(1)))
                          for m in re.finditer(r"ndkVersion\s*(?::\s*String\s*)?=\s*\"(\d+(?:\.\d+){1,3})\"", t):
                              if re.search(r"flutter\.ndkVersion", app_gradle):
                                  acc["ndk"].add(m.group(1))
              # plugin Flutter dari package_config.json
              pc = os.path.join(PROJECT, ".dart_tool", "package_config.json")
              n_scan = 0
              try:
                  pkgs = json.load(open(pc, encoding="utf-8")).get("packages", [])
                  base = os.path.dirname(pc)
                  for p in pkgs:
                      uri = p.get("rootUri", "")
                      if uri.startswith("file://"):
                          d = urllib.request.url2pathname(uri[7:])
                      else:
                          d = os.path.normpath(os.path.join(base, uri))
                      adir = os.path.join(d, "android")
                      if os.path.isdir(adir):
                          for fn in ("build.gradle", "build.gradle.kts"):
                              t = read(os.path.join(adir, fn))
                              if t:
                                  n_scan += 1
                                  sub = new_acc()
                                  scan_gradle_text(t, sub)
                                  acc["compile"] |= sub["compile"]; acc["tools"] |= sub["tools"]
                                  acc["ndk"] |= sub["ndk"]; acc["cmake"] |= sub["cmake"]
                                  if sub["native_code"]: acc["native_code"] = True
                                  jdk_req |= sub["jdk_req"]
              except Exception as e:  # noqa
                  warn(f"package_config.json tidak terbaca: {e}")
              tc.update({"compile": sorted(acc["compile"]), "tools": sorted(acc["tools"]), "ndk": sorted(acc["ndk"]),
                         "cmake": sorted(acc["cmake"]), "native_code": acc["native_code"], "plugins_scanned": n_scan})
              new_java = choose_java(tc.get("gradle_wrapper_version") or "", tc.get("agp") or "", set(tc.get("jdk_req", [])) | jdk_req,
                                     tc.get("flutter") or tc.get("flutter_alt"), os.environ.get("OVR_JAVA", ""))
              if new_java > int(tc.get("java", 0)):
                  warn(f"Plugin membutuhkan JDK {new_java} (terdeteksi sebelumnya {tc['java']}).")
                  tc["java"] = new_java
              json.dump(tc, open(TC_JSON, "w", encoding="utf-8"), indent=2)
              print(f"Plugin dipindai: {n_scan}")
              out("java", tc["java"])
              out("compile_sdks", ",".join(map(str, tc["compile"])))


          if __name__ == "__main__":
              cmd = sys.argv[1] if len(sys.argv) > 1 else ""
              {"locate": cmd_locate, "toolchain": cmd_toolchain, "plugins": cmd_plugins}.get(cmd, lambda: fail(f"subcommand tidak dikenal: {cmd}"))()
