                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          webView.setVisibility(View.GONE);
                          root.addView(view, new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          root.removeView(customView);
                          customView = null;
                          webView.setVisibility(View.VISIBLE);
                          getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          if (customViewCallback != null) customViewCallback.onCustomViewHidden();
                          customViewCallback = null;
                      }
                  });

                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition,
                                                  String mimeType, long contentLength) {
                          try {
                              DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                              req.setMimeType(mimeType);
                              String cookies = CookieManager.getInstance().getCookie(url);
                              if (cookies != null) req.addRequestHeader("Cookie", cookies);
                              req.addRequestHeader("User-Agent", userAgent);
                              req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                              String name = URLUtil.guessFileName(url, contentDisposition, mimeType);
                              req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                              DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                              if (dm != null) {
                                  dm.enqueue(req);
                                  Toast.makeText(MainActivity.this, "Mengunduh " + name, Toast.LENGTH_SHORT).show();
                              }
                          } catch (Exception e) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              } catch (Exception ignored) {
                                  Toast.makeText(MainActivity.this, "Gagal mengunduh file", Toast.LENGTH_SHORT).show();
                              }
                          }
                      }
                  });

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(START_URL);
                  }
              }

              private boolean handleUrl(String url) {
                  if (url.startsWith("http://") || url.startsWith("https://") || url.startsWith("file://")
                          || url.startsWith("about:") || url.startsWith("javascript:") || url.startsWith("data:")) {
                      return false;
                  }
                  try {
                      Intent intent;
                      if (url.startsWith("intent:")) {
                          intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                          intent.addCategory(Intent.CATEGORY_BROWSABLE);
                          intent.setComponent(null);
                      } else {
                          intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      }
                      startActivity(intent);
                  } catch (Exception e) {
                      Toast.makeText(this, "Tidak ada aplikasi untuk membuka tautan ini", Toast.LENGTH_SHORT).show();
                  }
                  return true;
              }

              private void showOffline(WebView view, String failedUrl) {
                  String html = "<html><head><meta name='viewport' content='width=device-width,initial-scale=1'></head>"
                          + "<body style='font-family:sans-serif;text-align:center;padding:48px 24px;color:#444'>"
                          + "<h2>Tidak dapat terhubung</h2><p>Periksa koneksi internet lalu coba lagi.</p>"
                          + "<p><a href='" + failedUrl.replace("'", "%27") + "' style='display:inline-block;padding:12px 28px;"
                          + "background:#1E88E5;color:#fff;border-radius:24px;text-decoration:none'>Coba lagi</a></p>"
                          + "</body></html>";
                  view.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
              }

              private boolean hasAll(List<String> perms) {
                  if (Build.VERSION.SDK_INT < 23) return true;
                  for (String p : perms) {
                      if (checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) return false;
                  }
                  return true;
              }

              private void ask(List<String> perms) {
                  if (Build.VERSION.SDK_INT >= 23) {
                      requestPermissions(perms.toArray(new String[0]), REQ_PERM);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode != REQ_PERM) return;
                  boolean ok = grantResults.length > 0;
                  for (int g : grantResults) {
                      if (g != PackageManager.PERMISSION_GRANTED) ok = false;
                  }
                  if (pendingWebPermission != null) {
                      if (ok) pendingWebPermission.grant(pendingWebPermission.getResources());
                      else pendingWebPermission.deny();
                      pendingWebPermission = null;
                  }
                  if (pendingGeoCallback != null) {
                      pendingGeoCallback.invoke(pendingGeoOrigin, ok, false);
                      pendingGeoCallback = null;
                      pendingGeoOrigin = null;
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_FILE && filePathCallback != null) {
                      Uri[] result = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      filePathCallback.onReceiveValue(result);
                      filePathCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      webView.getWebChromeClient().onHideCustomView();
                  } else if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  webView.onPause();
                  CookieManager.getInstance().flush();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  webView.onResume();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      root.removeView(webView);
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
