                  has_x = re.search(r"^\s*android\.useAndroidX\s*=", new, re.M)
                  agp = tc.get("agp") or ""
                  agp_t = tuple(int(x) for x in re.findall(r"\d+", agp)[:2]) if agp else (9, 9)
                  if not has_x and (ENGINE == "flutter" or agp_t >= (3, 2)):
                      new = new.rstrip("\n") + "\nandroid.useAndroidX=true\n"
                      if not re.search(r"^\s*android\.enableJetifier\s*=", new, re.M):
                          new += "android.enableJetifier=true\n"
