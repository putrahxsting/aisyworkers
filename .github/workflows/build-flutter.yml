              re.compile(r"Gradle task .* failed"),
              re.compile(r"\berror:\s", re.I),
              re.compile(r"^\s*(Error|ERROR|Exception)\b|\bException:\s"),
              re.compile(r"Could not (resolve|find|GET|determine|download)", re.I),
              re.compile(r"Namespace not specified|Unsupported class file|Minimum supported Gradle|SDK location not found|Failed to install the following|Plugin \[id: .*\] was not found", re.I),
              re.compile(r"Because .* (depends on|requires)|version solving failed", re.I),
              re.compile(r"No space left on device|java\.lang\.OutOfMemoryError|Java heap space|GC overhead", re.I),
          ]
          HINTS = [
              (r"Namespace not specified", "Modul/plugin lama tidak punya `namespace` (wajib di AGP 8+). Workflow sudah mencoba mengisinya otomatis; kalau masih gagal, perbarui plugin yang disebut di log."),
              (r"Unsupported class file major version|invalid source release|requires Java \d+|Java version", "Versi JDK tidak cocok dengan Gradle/AGP/Kotlin project. Kirim `javaVersion` di payload (mis. 11/17/21) atau perbarui versi Gradle."),
              (r"Minimum supported Gradle version is|requires Gradle \d", "Versi Gradle wrapper terlalu rendah untuk AGP. Naikkan `distributionUrl` di gradle-wrapper.properties."),
              (r"Could not find com\.android\.tools\.build:gradle|Plugin \[id: 'com\.android", "Versi Android Gradle Plugin tidak ditemukan di repositori. Periksa `repositories { google() }` dan versi AGP."),
              (r"licen[cs]e.*not been accepted|Failed to install the following Android SDK packages", "Lisensi/paket Android SDK belum terpasang. Cek langkah 'Android SDK' di log."),
              (r"SDK location not found", "sdk.dir tidak terbaca. Workflow menulis local.properties otomatis; pastikan project tidak memaksa jalur lain."),
              (r"Because .* (depends on|requires)|version solving failed|requires SDK version", "Constraint versi Dart/Flutter atau paket tidak cocok. Kirim `flutterVersion` di payload atau samakan sdk di pubspec.yaml."),
              (r"The method '.*' isn't defined|No named parameter|isn't a type|Undefined (name|class)|Error: Couldn't find constructor", "Kode Dart tidak kompatibel dengan versi Flutter yang dipakai. Coba `flutterVersion` yang lebih lama/baru."),
              (r"R8|minifyReleaseWithR8|Missing classes detected", "R8/ProGuard gagal. Tambahkan aturan -dontwarn / -keep, atau matikan minify di release."),
              (r"Keystore file .* not found|keystore|signingConfig", "Konfigurasi signing release gagal. Workflow membuat keystore sementara bila project memakai key.properties."),
              (r"google-services\.json|GoogleService-Info", "File google-services.json tidak ada di project (dibutuhkan plugin Firebase)."),
              (r"Duplicate class", "Ada library duplikat di dependency. Cari kelas yang disebut dan keluarkan salah satunya."),
              (r"OutOfMemoryError|Java heap space|GC overhead|No space left on device", "Memori/disk runner habis. Coba profil 'low' atau kurangi ukuran project."),
              (r"Could not resolve|Could not GET|Connection (timed out|reset)|Read timed out|Could not download", "Gagal mengunduh dependency (jaringan/repositori). Biasanya sementara; build ulang."),
              (r"compileSdk|requires libraries and applications that depend on it to compile against", "Dependency butuh compileSdk lebih tinggi. Naikkan compileSdk (workflow sudah memasang platform yang terdeteksi)."),
              (r"NDK|CMake|ninja", "Masalah NDK/CMake. Workflow memasang versi yang terbaca dari gradle; kirim `ndkVersion` di payload bila perlu."),
              (r"Kotlin.*(incompatible|binary version)|kotlin-gradle-plugin", "Versi Kotlin tidak cocok dengan Gradle/AGP/dependency."),
          ]

          hits = [i for i, ln in enumerate(lines) if any(p.search(ln) for p in PATTERNS)]
          seen, shown = set(), 0
          LOC = re.compile(r"([\w./\\-]+\.(?:dart|kt|kts|java|gradle|xml|yaml|yml|properties)):(\d+)(?::(\d+))?")
          ann = []
          for i in hits:
              ln = lines[i].strip()
              key = re.sub(r"\d+", "#", ln)[:120]
              if not ln or key in seen:
                  continue
              seen.add(key)
              m = LOC.search(ln.replace("file://", "")) 
              msg = ln[:300].replace("%", "%25").replace("\r", "").replace("\n", " ")
              if m:
                  fpath = m.group(1).lstrip("/")
                  for pref in (os.environ.get("GITHUB_WORKSPACE", "").lstrip("/") + "/",):
                      if pref != "/" and fpath.startswith(pref):
                          fpath = fpath[len(pref):]
                  ann.append(f"::error file={fpath},line={m.group(2)}{',col=' + m.group(3) if m.group(3) else ''},title=Build error::{msg}")
              else:
                  ann.append(f"::error title=Build error::{msg}")
              shown += 1
              if shown >= 12:
                  break

          text = "\n".join(lines)
          causes = []
          for pat, hint in HINTS:
              if re.search(pat, text, re.I) and hint not in causes:
                  causes.append(hint)

          print("::group::Ringkasan error build")
          if ann:
              print("\n".join(ann))
          else:
              print("::error title=Build gagal::Tidak ada pola error yang dikenali; lihat 120 baris terakhir log di bawah.")
          if causes:
              print("\nPerkiraan penyebab:")
              for c in causes[:6]:
                  print(f"  - {c}")
          print("::endgroup::")
          print("::group::120 baris terakhir log")
          print("\n".join(lines[-120:]))
          print("::endgroup::")

          os.makedirs(os.path.dirname(OUT_MD), exist_ok=True)
          with open(OUT_MD, "w", encoding="utf-8") as f:
              f.write("## Build gagal\n\n")
              if causes:
                  f.write("**Perkiraan penyebab**\n\n" + "\n".join(f"- {c}" for c in causes[:6]) + "\n\n")
              f.write("**Baris error**\n\n```\n" + "\n".join(lines[i].strip() for i in hits[:30])[:6000] + "\n```\n\n")
              f.write("**120 baris terakhir**\n\n```\n" + "\n".join(lines[-120:])[-8000:] + "\n```\n")
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write(open(OUT_MD, encoding="utf-8").read()[:60000])
          __CI_EOF__

      - name: "1c · Skrip bantu: unduh • SDK • build • diagnostik"
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ci/fetch.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # fetch.sh - unduh ZIP source (dengan retry + cadangan gh untuk repo privat) lalu ekstrak aman
          set -euo pipefail
          ZIP="$RUNNER_TEMP/src.zip"
          SHOW="${SRC_URL%%\?*}"
          echo "Mengunduh source: $SHOW"
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 900 -A "Mozilla/5.0" -o "$ZIP" "$SRC_URL"; then ok=1; break; fi
            echo "::warning::Unduhan percobaan $i gagal"; sleep $((i * 3))
          done
          if [ "$ok" -ne 1 ] && [[ "$SRC_URL" =~ github\.com/([^/]+/[^/]+)/releases/download/([^/]+)/([^?]+) ]]; then
            repo="${BASH_REMATCH[1]}"; tag="${BASH_REMATCH[2]}"
            asset="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.unquote(sys.argv[1]))' "${BASH_REMATCH[3]}")"
            echo "Mencoba 'gh release download' ($repo @ $tag)"
            rm -f "$ZIP"
            gh release download "$tag" -R "$repo" -p "$asset" -O "$ZIP" --clobber && ok=1 || true
          fi
          if [ "$ok" -ne 1 ]; then
            echo "::error title=Gagal mengunduh source::Link ZIP tidak bisa diunduh: $SHOW"
            exit 1
          fi
          SIZE=$(stat -c %s "$ZIP")
          echo "Ukuran ZIP: $((SIZE / 1024 / 1024)) MB"
          if [ "$SIZE" -lt 100 ] || ! unzip -tqq "$ZIP" >/dev/null 2>&1; then
            echo "::error title=ZIP rusak::File yang diunduh bukan ZIP valid (mungkin halaman error/izin). 80 byte pertama:"
            head -c 80 "$ZIP" | tr -c '[:print:]' '.'; echo
            exit 1
          fi
          UNC=$(unzip -l "$ZIP" | tail -1 | awk '{print $1}')
          if [ "${UNC:-0}" -gt 4000000000 ]; then
            echo "::error title=ZIP terlalu besar::Ukuran setelah ekstrak $((UNC / 1024 / 1024)) MB melebihi batas 4 GB."
            exit 1
          fi
          rm -rf "$GITHUB_WORKSPACE/_extract" "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/_extract"
          unzip -q -o "$ZIP" -d "$GITHUB_WORKSPACE/_extract" -x '__MACOSX/*' '*/.DS_Store' '.DS_Store'
          rm -f "$ZIP"
          echo "Ekstrak selesai: $(find "$GITHUB_WORKSPACE/_extract" -type f | wc -l) file"
          __CI_EOF__
          cat > "$RUNNER_TEMP/ci/sdk.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # sdk.sh - pasang komponen Android SDK yang dibutuhkan (platform, build-tools, NDK, CMake) + terima lisensi
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          TC="$GITHUB_WORKSPACE/_diag/toolchain.json"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"

          if [ -z "$SM" ] || [ ! -x "$SM" ]; then
            echo "cmdline-tools tidak ada -> mengunduh"
            mkdir -p "$SDK/cmdline-tools"
            curl -fL --retry 3 -o "$RUNNER_TEMP/clt.zip" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              && unzip -q -o "$RUNNER_TEMP/clt.zip" -d "$RUNNER_TEMP/clt" \
              && rm -rf "$SDK/cmdline-tools/latest" && mv "$RUNNER_TEMP/clt/cmdline-tools" "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SM" ]; then
            echo "::warning::sdkmanager tidak tersedia; komponen SDK akan diunduh otomatis oleh Gradle (jika lisensi diterima)."
            exit 0
          fi
          # sdkmanager terbaru butuh JDK 17+, terlepas dari JDK untuk build
          SMJ="${JAVA_HOME_17_X64:-${JAVA_HOME_21_X64:-${JAVA_HOME:-}}}"
          sdk() { JAVA_HOME="$SMJ" PATH="$SMJ/bin:$PATH" "$SM" --sdk_root="$SDK" "$@"; }

          mkdir -p "$SDK/licenses"
          yes | sdk --licenses >/dev/null 2>&1 || true
          echo "Lisensi Android SDK diterima."

          LIST="$RUNNER_TEMP/sdk-list.txt"
          for i in 1 2 3; do sdk --list > "$LIST" 2>/dev/null && [ -s "$LIST" ] && break; sleep 3; done

          mapfile -t WANT < <(python3 - <<'PY'
          import json, os
          tc = json.load(open(os.environ["GITHUB_WORKSPACE"] + "/_diag/toolchain.json"))
          pk = ["platform-tools"]
          pk += [f"platforms;android-{n}" for n in tc.get("compile", []) if 21 <= int(n) <= 40]
          pk += [f"build-tools;{v}" for v in tc.get("tools", [])]
          pk += [f"ndk;{v}" for v in tc.get("ndk", [])]
          pk += [f"cmake;{v}" for v in tc.get("cmake", [])]
          print("\n".join(dict.fromkeys(pk)))
          PY
          )

          installed() { # installed <paket> : cek folder
            case "$1" in
              platform-tools) [ -d "$SDK/platform-tools" ] ;;
              platforms\;*) [ -d "$SDK/platforms/${1#platforms;}" ] ;;
              build-tools\;*) [ -d "$SDK/build-tools/${1#build-tools;}" ] ;;
              ndk\;*) [ -d "$SDK/ndk/${1#ndk;}" ] ;;
              cmake\;*) [ -d "$SDK/cmake/${1#cmake;}" ] ;;
              *) return 1 ;;
            esac
          }

          for pkg in "${WANT[@]}"; do
            [ -z "$pkg" ] && continue
            if installed "$pkg"; then echo "✔ sudah ada: $pkg"; continue; fi
            if [ -s "$LIST" ] && ! grep -qE "^[[:space:]]*$(printf '%s' "$pkg" | sed 's/[.;]/\\&/g')[[:space:]]*\|" "$LIST"; then
              echo "::warning::Paket '$pkg' tidak ada di repositori sdkmanager; dilewati (Gradle akan mencoba sendiri)."
              continue
            fi
            for try in 1 2 3; do
              echo "⬇ memasang $pkg (percobaan $try)"
              if yes | sdk "$pkg" >"$RUNNER_TEMP/sdk-inst.log" 2>&1 && installed "$pkg"; then echo "✔ terpasang: $pkg"; break; fi
              tail -3 "$RUNNER_TEMP/sdk-inst.log"; sleep $((try * 4))
              [ "$try" = 3 ] && echo "::warning::Gagal memasang $pkg; Gradle akan mencoba mengunduh otomatis."
            done
          done

          # pastikan ada build-tools (untuk zipalign/apksigner)
          if ! ls "$SDK"/build-tools/*/apksigner >/dev/null 2>&1; then
            echo "build-tools belum ada -> memasang build-tools;35.0.0"
            yes | sdk "build-tools;35.0.0" >/dev/null 2>&1 || yes | sdk "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi

          # NDK utama (untuk tool yang membaca ANDROID_NDK_HOME)
          NDKDIR=""
          REQ="$(python3 -c "import json,os;print((json.load(open(os.environ['GITHUB_WORKSPACE']+'/_diag/toolchain.json')).get('ndk') or [''])[0])")"
          if [ -n "$REQ" ] && [ -d "$SDK/ndk/$REQ" ]; then NDKDIR="$SDK/ndk/$REQ"
          elif ls -d "$SDK"/ndk/*/ >/dev/null 2>&1; then NDKDIR="$(ls -d "$SDK"/ndk/*/ | sort -V | tail -1)"; NDKDIR="${NDKDIR%/}"; fi
          {
            echo "ANDROID_HOME=$SDK"; echo "ANDROID_SDK_ROOT=$SDK"
            if [ -n "$NDKDIR" ]; then echo "ANDROID_NDK_HOME=$NDKDIR"; echo "ANDROID_NDK_ROOT=$NDKDIR"; echo "ANDROID_NDK=$NDKDIR"; fi
          } >> "$GITHUB_ENV"
          echo "::group::Isi Android SDK"
          for d in platforms build-tools ndk cmake; do echo "$d: $(ls "$SDK/$d" 2>/dev/null | tr '\n' ' ')"; done
          echo "::endgroup::"
          exit 0
          __CI_EOF__
          cat > "$RUNNER_TEMP/ci/build.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # build.sh - build Flutter / Android native dengan retry bertahap, log lengkap, tanda tangan APK, dan ringkasan
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE"; DIAG="$ROOT/_diag"; LOG="$DIAG/build.log"; OUT="$ROOT/out"; PRJ="$ROOT/project"
          mkdir -p "$DIAG" "$OUT"; : > "$LOG"
          TYPE="${BUILD_TYPE:-release}"; PERF="${PERF_MODE:-fast}"; ENGINE="${ENGINE:-native}"
          tcget() { python3 -c "import json,sys;print(json.load(open('$DIAG/toolchain.json')).get(sys.argv[1]) or '')" "$1" 2>/dev/null; }
          FLAVOR="$(tcget flavor)"; MODULE="$(tcget app_module)"; ALT="$(tcget flutter_alt)"
          CAP="$(printf '%s' "${TYPE:0:1}" | tr a-z A-Z)${TYPE:1}"

          summary() { [ -n "${GITHUB_STEP_SUMMARY:-}" ] && printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; return 0; }

          run() { # run <label> <cmd...> : jalankan + simpan ke log, kode keluar asli dipertahankan
            local label="$1"; shift
            echo "::group::$label"
            echo "\$ $*" | tee -a "$LOG"
            "$@" 2>&1 | tee -a "$LOG"
            local rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ "$rc" -eq 0 ] || echo "✖ '$label' keluar dengan kode $rc" | tee -a "$LOG"
            return "$rc"
          }

          env_report() {
            {
              echo "== waktu: $(date -u +%FT%TZ)"
              echo "== runner: $(uname -a)"; echo "== disk:"; df -h "$ROOT" | tail -1; echo "== memori:"; free -m | sed -n 2p
              echo "== java:"; java -version 2>&1; echo "JAVA_HOME=${JAVA_HOME:-}"
              echo "== android: ANDROID_HOME=${ANDROID_HOME:-} NDK=${ANDROID_NDK_HOME:-}"
              for d in platforms build-tools ndk cmake; do echo "$d: $(ls "${ANDROID_HOME:-/x}/$d" 2>/dev/null | tr '\n' ' ')"; done
              if [ "$ENGINE" = flutter ]; then echo "== flutter:"; flutter --version 2>&1 | head -6; fi
              echo "== toolchain.json:"; cat "$DIAG/toolchain.json" 2>/dev/null
              for w in "$PRJ/android/gradle/wrapper/gradle-wrapper.properties" "$PRJ/gradle/wrapper/gradle-wrapper.properties"; do
                [ -f "$w" ] && { echo "== $w"; grep distributionUrl "$w"; }
              done
            } > "$DIAG/env.txt" 2>&1
            echo "::group::Lingkungan build"; cat "$DIAG/env.txt"; echo "::endgroup::"
          }

          cleanup_state() {
            (cd "$PRJ/android" 2>/dev/null && ./gradlew --stop >/dev/null 2>&1) || true
            (cd "$PRJ" && ./gradlew --stop >/dev/null 2>&1) || true
            rm -rf "$HOME/.gradle/daemon" 2>/dev/null || true
          }

          # ── Flutter ────────────────────────────────────────────────────────────────
          flutter_build() { # flutter_build <label> <v|n>
            local a=(build apk "--$TYPE" --no-pub)
            if [ "$PERF" = low ]; then a+=(--target-platform android-arm,android-arm64); else a+=(--target-platform android-arm64 --no-tree-shake-icons); fi
            [ -n "$FLAVOR" ] && a+=(--flavor "$FLAVOR")
            [ "$2" = v ] && a+=(-v)
            (cd "$PRJ" && run "$1" flutter "${a[@]}")
          }

          install_alt_flutter() { # install_alt_flutter <versi>
            local v="$1" d="$HOME/flutter-alt-$1"
            echo "::group::Pasang Flutter alternatif $v"
            if [ ! -x "$d/bin/flutter" ]; then
              mkdir -p "$RUNNER_TEMP/fl" && rm -rf "$RUNNER_TEMP/fl/flutter"
              curl -fL --retry 3 "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${v}-stable.tar.xz" \
                | tar -xJ -C "$RUNNER_TEMP/fl" || { echo "::endgroup::"; return 1; }
              mv "$RUNNER_TEMP/fl/flutter" "$d"
            fi
            export FLUTTER_ROOT="$d" PATH="$d/bin:$PATH"
            git config --global --add safe.directory "$d" 2>/dev/null || true
            flutter --version 2>&1 | head -3
            local lp="$PRJ/android/local.properties"
            [ -f "$lp" ] && sed -i "s#^flutter.sdk=.*#flutter.sdk=$d#" "$lp"
            echo "::endgroup::"
          }

          build_flutter() {
            if flutter_build "flutter build apk ($TYPE, $PERF)" n; then return 0; fi
            echo "::warning::Build gagal. Mengulang dengan state bersih + log verbose."
            cleanup_state
            (cd "$PRJ" && flutter clean >/dev/null 2>&1; run "flutter pub get (ulang)" flutter pub get) || true
            if flutter_build "flutter build apk (ulang, verbose)" v; then return 0; fi
            if [ -n "$ALT" ]; then
              echo "::warning::Mencoba Flutter alternatif $ALT (seangkatan constraint SDK project)."
              cleanup_state
              if install_alt_flutter "$ALT"; then
                (cd "$PRJ" && flutter clean >/dev/null 2>&1; run "flutter pub get (SDK $ALT)" flutter pub get) || true
                if flutter_build "flutter build apk (Flutter $ALT)" v; then return 0; fi
              else
                echo "::warning::Flutter $ALT tidak bisa diunduh."
              fi
            fi
            return 1
          }

          # ── Android native ─────────────────────────────────────────────────────────
          build_native() {
            cd "$PRJ" || return 1
            local GR=./gradlew
            if [ -f ./gradlew ]; then chmod +x ./gradlew; else GR=gradle; echo "::notice::gradlew tidak ada -> memakai gradle $(gradle --version 2>/dev/null | sed -n 3p)"; fi
            local task="assemble$CAP"
            [ -n "$MODULE" ] && task=":${MODULE//\//:}:$task"
            local base=(--no-daemon --stacktrace --warning-mode=summary)
            if run "gradle $task" $GR "${base[@]}" "$task"; then return 0; fi
            echo "::warning::Gradle gagal. Mengulang dengan state bersih, refresh dependency, dan --info."
            cleanup_state
            if run "gradle $task (ulang, --info)" $GR "${base[@]}" --refresh-dependencies --info "$task"; then return 0; fi
            return 1
          }

          # ── pilih & tanda tangan APK ───────────────────────────────────────────────
          pick_apk() {
            python3 - "$TYPE" "$PRJ" <<'PY'
          import os, sys
          typ, root = sys.argv[1], sys.argv[2]
          best = None
          for dp, dns, fns in os.walk(root):
              dns[:] = [d for d in dns if d not in (".git", "node_modules", ".dart_tool", "intermediates", ".gradle", "androidTest")]
              for fn in fns:
                  if not fn.endswith(".apk"):
                      continue
                  p = os.path.join(dp, fn)
                  low = p.lower()
                  if "androidtest" in low or "/intermediates/" in low:
                      continue
                  score = 0
                  score += 20 if typ in low else 0
                  score += 10 if "unsigned" not in low else 0
                  score += 5 if "universal" in low else 0
                  score += 3 if "/flutter-apk/" in low else 0
                  score += 2 if "/outputs/" in low else 0
                  key = (score, os.path.getsize(p))
                  if best is None or key > best[0]:
                      best = (key, p)
          print(best[1] if best else "")
          PY
          }

          finalize_apk() { # finalize_apk <input.apk> -> $OUT/app-$TYPE.apk
            local in="$1" dest="$OUT/app-$TYPE.apk"
            local BT; BT="$(ls -d "${ANDROID_HOME:-/x}"/build-tools/* 2>/dev/null | sort -V | tail -1)"
            local KS="${CI_KEYSTORE:-$HOME/.android/ci-release.jks}"
            if [ -n "$BT" ] && [ -x "$BT/apksigner" ] && "$BT/apksigner" verify "$in" >/dev/null 2>&1; then
              cp -f "$in" "$dest"; echo "APK sudah bertanda tangan."
            elif [ -n "$BT" ] && [ -x "$BT/apksigner" ] && [ -f "$KS" ]; then
              echo "APK belum bertanda tangan -> zipalign + apksigner (keystore sementara CI)"
              "$BT/zipalign" -f -p 4 "$in" "$RUNNER_TEMP/aligned.apk" || cp -f "$in" "$RUNNER_TEMP/aligned.apk"
              "$BT/apksigner" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android --ks-key-alias ci --out "$dest" "$RUNNER_TEMP/aligned.apk" \
                || { echo "::warning::apksigner gagal; mengirim APK apa adanya"; cp -f "$in" "$dest"; }
            else
              echo "::warning::apksigner/keystore tidak tersedia; mengirim APK apa adanya"; cp -f "$in" "$dest"
            fi
            if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then "$BT/apksigner" verify --print-certs "$dest" 2>&1 | head -3 || true; fi
            if [ -n "$BT" ] && [ -x "$BT/aapt2" ]; then
              "$BT/aapt2" dump badging "$dest" 2>/dev/null | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label:)" > "$DIAG/badging.txt" || true
            fi
          }

          # ── main ───────────────────────────────────────────────────────────────────
          env_report
          START=$(date +%s)
          if [ "$ENGINE" = flutter ]; then build_flutter; else build_native; fi
          RC=$?
          ELAPSED=$(( $(date +%s) - START ))

          if [ "$RC" -ne 0 ]; then
            python3 "$RUNNER_TEMP/ci/errsum.py" "$LOG"
            echo "::error title=Build $ENGINE gagal::Semua percobaan build gagal setelah ${ELAPSED}s. Lihat 'Ringkasan error build' di atas dan artifact diag-${JOB_ID}."
            exit 1
          fi

          APK="$(pick_apk)"
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error title=APK tidak ditemukan::Build berhasil tetapi tidak ada file .apk. Isi folder outputs:"
            find "$PRJ" -path '*/outputs/*' -maxdepth 8 -type f 2>/dev/null | head -40
            find "$PRJ" -name '*.aab' 2>/dev/null | head -5
            exit 1
          fi
          echo "APK terpilih: $APK"
          finalize_apk "$APK"
          FINAL="$OUT/app-$TYPE.apk"
          [ -f "$FINAL" ] || { echo "::error::finalisasi APK gagal"; exit 1; }
          SIZE_MB=$(du -m "$FINAL" | cut -f1)
          echo "✔ APK siap: $FINAL (${SIZE_MB} MB, build ${ELAPSED}s)"
          echo "apk_path=$FINAL" >> "$GITHUB_OUTPUT"
          echo "apk_size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
          summary ""; summary "### ✅ Build berhasil"; summary ""
          summary "| Item | Nilai |"; summary "|---|---|"
          summary "| Engine | \`$ENGINE\` |"; summary "| Waktu build | ${ELAPSED}s |"; summary "| Ukuran APK | ${SIZE_MB} MB |"
          summary "| JDK | \`$(java -version 2>&1 | head -1)\` |"
          [ "$ENGINE" = flutter ] && summary "| Flutter | \`$(flutter --version 2>/dev/null | head -1)\` |"
          [ -f "$DIAG/badging.txt" ] && { summary ""; summary '```'; summary "$(cat "$DIAG/badging.txt")"; summary '```'; }
          exit 0
          __CI_EOF__
          cat > "$RUNNER_TEMP/ci/diag.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # diag.sh - kumpulkan diagnostik build gagal ke _diag/ (tanpa file rahasia seperti keystore/key.properties)
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE"; D="$ROOT/_diag"; P="$ROOT/project"
          mkdir -p "$D/config" "$D/reports"
          [ -f "$D/error-summary.md" ] || { [ -s "$D/build.log" ] && python3 "$RUNNER_TEMP/ci/errsum.py" "$D/build.log" >/dev/null 2>&1; }
          if [ -d "$P" ]; then
            (cd "$P" && find . \( -path '*/build' -o -path './.git' -o -path '*/node_modules' -o -path '*/.dart_tool' -o -path '*/.gradle' -o -path '*/Pods' -o -path './ios' -o -path './macos' -o -path './web' -o -path './windows' -o -path './linux' \) -prune -o -type f \
              \( -name 'pubspec.yaml' -o -name 'pubspec.lock' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'gradle.properties' -o -name 'gradle-wrapper.properties' -o -name 'libs.versions.toml' -o -name 'AndroidManifest.xml' -o -name '.fvmrc' -o -name 'l10n.yaml' \) -print 2>/dev/null \
              | head -150 | while read -r f; do mkdir -p "$D/config/$(dirname "$f")"; cp "$f" "$D/config/$f" 2>/dev/null; done)
            # laporan Gradle & crash JVM
            (cd "$P" && find . -path '*/build/reports/*' -type f \( -name '*.html' -o -name '*.txt' -o -name '*.xml' -o -name '*.json' \) -size -3M 2>/dev/null | head -60 \
              | while read -r f; do mkdir -p "$D/reports/$(dirname "$f")"; cp "$f" "$D/reports/$f" 2>/dev/null; done)
            find "$P" -name 'hs_err_pid*.log' -size -5M -exec cp {} "$D/" \; 2>/dev/null
            find "$P" -name 'flutter_*.log' -size -5M -exec cp {} "$D/" \; 2>/dev/null
          fi
          {
            echo "== java"; java -version 2>&1
            echo "== android sdk"; for d in platforms build-tools ndk cmake; do echo "$d: $(ls "${ANDROID_HOME:-/x}/$d" 2>/dev/null | tr '\n' ' ')"; done
            if command -v flutter >/dev/null 2>&1; then echo "== flutter doctor -v"; timeout 120 flutter doctor -v 2>&1 | head -80; fi
            echo "== gradle daemon logs"; ls -la "$HOME/.gradle/daemon"/*/ 2>/dev/null | head -20
            echo "== disk"; df -h "$ROOT" | tail -2
            echo "== memori"; free -m
          } > "$D/system.txt" 2>&1
          # daemon log Gradle terbaru (sering berisi penyebab crash)
          LAST="$(ls -t "$HOME"/.gradle/daemon/*/daemon-*.out.log 2>/dev/null | head -1 || true)"
          [ -n "$LAST" ] && tail -n 400 "$LAST" > "$D/gradle-daemon-tail.log" 2>/dev/null
          echo "Diagnostik terkumpul: $(find "$D" -type f | wc -l) file ($(du -sh "$D" | cut -f1))"
          __CI_EOF__
          chmod +x "$RUNNER_TEMP"/ci/*.sh
          # kosongkan ruang disk di latar belakang (tidak menyentuh Android SDK / JDK)
          (sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL" >/dev/null 2>&1 &) || true

      - name: "2 · Baca & validasi payload"
        shell: bash
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD" > "$GITHUB_WORKSPACE/_diag/payload.json"
          python3 "$RUNNER_TEMP/ci/payload.py"

      - name: "3a · Unduh & ekstrak source ZIP"
        id: loc
        if: env.BUILD_MODE == 'zip'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/ci/fetch.sh"
          python3 "$RUNNER_TEMP/ci/detect.py" locate

      - name: "3b · Buat project Web → APK"
        if: env.BUILD_MODE == 'url'
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import PIL" 2>/dev/null \
            || python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pillow \
            || python3 -m pip install --quiet --disable-pip-version-check --user pillow \
            || echo "::warning::Pillow tidak terpasang; ikon bawaan sistem dipakai."
          python3 "$RUNNER_TEMP/ci/webgen.py"

      - name: "4 · Deteksi toolchain (Flutter / JDK / Gradle / SDK / NDK)"
        id: tc
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/ci/detect.py" toolchain

      # ── Flutter ──────────────────────────────────────────────────────────
      - name: "5a · Pasang Flutter ${{ steps.tc.outputs.flutter_selector || steps.tc.outputs.channel }}"
        id: flutter1
        if: env.ENGINE == 'flutter'
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.tc.outputs.flutter_selector }}
          channel: ${{ steps.tc.outputs.channel || 'stable' }}
          cache: true

      - name: "5b · Pasang Flutter stable (cadangan)"
        if: env.ENGINE == 'flutter' && steps.flutter1.outcome == 'failure'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: "5c · Siapkan project Flutter (create • pub get • build_runner • plugin)"
        id: plug
        if: env.ENGINE == 'flutter'
        shell: bash
        working-directory: project
        run: |
          set -uo pipefail
          LOG="$GITHUB_WORKSPACE/_diag/build.log"
          flutter config --no-analytics >/dev/null 2>&1 || true
          flutter --version 2>&1 | tee -a "$LOG"
          if [ ! -d android ]; then
            NAME="$(sed -n 's/^name:[[:space:]]*//p' pubspec.yaml | head -1 | tr -d "\"' \r")"
            echo "::group::flutter create (android/ tidak ada)"
            flutter create --platforms=android --project-name "${NAME:-app}" --org com.example . 2>&1 | tee -a "$LOG" || true
            echo "::endgroup::"
          fi
          ok=0
          for i in 1 2 3; do
            echo "::group::flutter pub get (percobaan $i)"
            if flutter pub get 2>&1 | tee -a "$LOG"; then ok=1; echo "::endgroup::"; break; fi
            echo "::endgroup::"; sleep $((i * 5))
          done
          if [ "$ok" != 1 ]; then
            python3 "$RUNNER_TEMP/ci/errsum.py" "$LOG"
            echo "::error title=flutter pub get gagal::Dependency tidak bisa diselesaikan. Lihat ringkasan di atas."
            exit 1
          fi
          # build_runner: jalankan kalau ada file part (*.g.dart / *.freezed.dart) yang belum dihasilkan
          NEED=$(python3 - <<'PY'
          import glob, os, re
          if not re.search(r"^\s*build_runner\s*:", open("pubspec.yaml", errors="ignore").read(), re.M):
              print("false"); raise SystemExit
          miss = False
          for f in glob.glob("lib/**/*.dart", recursive=True):
              t = open(f, errors="ignore").read()
              for m in re.finditer(r"^part\s+['\"]([^'\"]+\.(?:g|freezed|gr|config|mocks)\.dart)['\"]\s*;", t, re.M):
                  if not os.path.exists(os.path.join(os.path.dirname(f), m.group(1))):
                      miss = True
          print("true" if miss else "false")
          PY
          )
          if [ "$NEED" = "true" ]; then
            echo "::group::dart run build_runner build"
            dart run build_runner build --delete-conflicting-outputs 2>&1 | tee -a "$LOG" || echo "::warning::build_runner gagal (build tetap dilanjutkan)"
            echo "::endgroup::"
          fi
          python3 "$RUNNER_TEMP/ci/detect.py" plugins

      # ── JDK & Gradle ─────────────────────────────────────────────────────
      - name: "6a · Pasang JDK ${{ steps.plug.outputs.java || steps.tc.outputs.java }} (Temurin)"
        id: java1
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.plug.outputs.java || steps.tc.outputs.java }}

      - name: "6b · Pasang JDK (cadangan Zulu)"
        if: steps.java1.outcome == 'failure'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ steps.plug.outputs.java || steps.tc.outputs.java }}

      - name: "6c · Gradle (cache + versi bila project tanpa wrapper)"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.tc.outputs.has_wrapper == 'false' && env.ENGINE == 'native' && steps.tc.outputs.gradle || '' }}
          cache-read-only: false

      # ── Android SDK / NDK ────────────────────────────────────────────────
      - name: "7 · Keystore sementara untuk tanda tangan APK"
        shell: bash
        run: |
          set -euo pipefail
          KS="$HOME/.android/ci-release.jks"
          rm -f "$KS"
          keytool -genkeypair -keystore "$KS" -storepass android -keypass android -alias ci \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CI Build, OU=CI, O=Bot, C=ID" >/dev/null 2>&1
          {
            echo "CI_KEYSTORE=$KS"; echo "CI_STORE_PASS=android"; echo "CI_KEY_ALIAS=ci"; echo "CI_KEY_PASS=android"
          } >> "$GITHUB_ENV"

      - name: "8 · Pasang komponen Android SDK (platform • build-tools • NDK • CMake)"
        shell: bash
        run: bash "$RUNNER_TEMP/ci/sdk.sh"

      - name: "9 · Tambal project agar bisa dibuild di runner"
        shell: bash
        run: python3 "$RUNNER_TEMP/ci/prepare.py"

      # ── Build ────────────────────────────────────────────────────────────
      - name: "10 · Build APK (${{ env.ENGINE }} • ${{ env.BUILD_TYPE }} • ${{ env.PERF_MODE }})"
        id: build
        shell: bash
        run: bash "$RUNNER_TEMP/ci/build.sh"

      - name: "11 · Upload APK"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      # ── Jika gagal: kirim semua bukti ke artifact diag-<jobId> ──────────
      - name: "12 · Kumpulkan diagnostik (gagal)"
        if: failure()
        shell: bash
        run: bash "$RUNNER_TEMP/ci/diag.sh"

      - name: "13 · Upload diagnostik lengkap (gagal)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ inputs.jobId }}
          path: _diag
          if-no-files-found: ignore
          retention-days: 3
