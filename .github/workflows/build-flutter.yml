          """prepare.py - tambal ringan agar project hasil ZIP bisa dibuild di runner (tidak mengubah logika aplikasi)."""
          import json, os, re, stat, sys

          WS = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          PROJECT = os.path.join(WS, "project")
          TC = os.path.join(WS, "_diag", "toolchain.json")
          ENGINE = os.environ.get("ENGINE", "native")
          HOME = os.path.expanduser("~")
          fixes = []


          def note(msg):
              fixes.append(msg)
              print(f"::notice::[prepare] {msg}")


          def read(p):
              try:
                  with open(p, "r", encoding="utf-8-sig", errors="replace") as f:
                      return f.read()
              except OSError:
                  return ""


          def write(p, s):
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w", encoding="utf-8", newline="\n") as f:
                  f.write(s)


          gradle_root = os.path.join(PROJECT, "android") if ENGINE == "flutter" else PROJECT
          tc = {}
          try:
              tc = json.load(open(TC, encoding="utf-8"))
          except Exception:
              pass


          def fix_wrapper():
              gw = os.path.join(gradle_root, "gradlew")
              if os.path.exists(gw):
                  raw = open(gw, "rb").read()
                  if b"\r\n" in raw:
                      open(gw, "wb").write(raw.replace(b"\r\n", b"\n"))
                      note("gradlew: CRLF diubah ke LF")
                  os.chmod(gw, os.stat(gw).st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
              wp = os.path.join(gradle_root, "gradle", "wrapper", "gradle-wrapper.properties")
              if os.path.exists(wp):
                  raw = open(wp, "rb").read()
                  txt = raw.decode("utf-8-sig", errors="replace").replace("\r\n", "\n")
                  new = txt
                  m = re.search(r"distributionUrl\s*=\s*(.+)", new)
                  if m and m.group(1).strip().replace("\\", "").lower().startswith(("file:", "http:")):
                      ver = re.search(r"gradle-(\d+(?:\.\d+){1,2})", m.group(1))
                      if ver:
                          new = new.replace(m.group(1), f"https\\://services.gradle.org/distributions/gradle-{ver.group(1)}-bin.zip")
                          note("distributionUrl wrapper diarahkan ke services.gradle.org (https)")
                  if new.encode() != raw:
