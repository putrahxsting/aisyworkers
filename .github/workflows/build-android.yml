          import android.widget.FrameLayout;
          import android.widget.ProgressBar;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private static final String START_URL = __URL__;
              private static final int REQ_FILE = 1001;
              private static final int REQ_PERM = 1002;

              private WebView webView;
              private ProgressBar progress;
              private FrameLayout root;
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;
              private ValueCallback<Uri[]> filePathCallback;
              private PermissionRequest pendingWebPermission;
              private GeolocationPermissions.Callback pendingGeoCallback;
              private String pendingGeoOrigin;

              @SuppressLint({"SetJavaScriptEnabled", "ClickableViewAccessibility"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  root = new FrameLayout(this);
                  webView = new WebView(this);
                  root.addView(webView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  progress = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progress.setMax(100);
                  FrameLayout.LayoutParams plp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, (int) (3 * getResources().getDisplayMetrics().density));
                  root.addView(progress, plp);
                  setContentView(root);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);
                  s.setSupportZoom(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  // UA seperti Chrome seluler supaya login/halaman tertentu tidak menolak WebView
                  String ua = s.getUserAgentString();
                  if (ua != null) {
                      ua = ua.replace("; wv", "").replaceAll("Version/\\d+\\.\\d+ ", "");
                      s.setUserAgentString(ua);
                  }

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleUrl(request.getUrl().toString());
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          progress.setVisibility(View.VISIBLE);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progress.setVisibility(View.GONE);
                          CookieManager.getInstance().flush();
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request,
                                                  android.webkit.WebResourceError error) {
                          if (request.isForMainFrame()) {
                              showOffline(view, request.getUrl().toString());
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          progress.setProgress(newProgress);
                          progress.setVisibility(newProgress >= 100 ? View.GONE : View.VISIBLE);
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                                                       FileChooserParams params) {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }
                          filePathCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), REQ_FILE);
                          } catch (ActivityNotFoundException e) {
                              filePathCallback = null;
                              Toast.makeText(MainActivity.this, "Tidak ada aplikasi pemilih file", Toast.LENGTH_SHORT).show();
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  List<String> need = new ArrayList<String>();
                                  for (String r : request.getResources()) {
                                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r)) need.add(Manifest.permission.CAMERA);
                                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)) need.add(Manifest.permission.RECORD_AUDIO);
                                  }
                                  if (need.isEmpty() || hasAll(need)) {
                                      request.grant(request.getResources());
                                  } else {
                                      pendingWebPermission = request;
                                      ask(need);
                                  }
                              }
                          });
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          List<String> need = new ArrayList<String>();
                          need.add(Manifest.permission.ACCESS_FINE_LOCATION);
                          if (hasAll(need)) {
                              callback.invoke(origin, true, false);
                          } else {
                              pendingGeoOrigin = origin;
                              pendingGeoCallback = callback;
                              ask(need);
                          }
                      }

                      @Override
                      public boolean onJsAlert(WebView view, String url, String message, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(message)
                                  .setPositiveButton(android.R.string.ok, new android.content.DialogInterface.OnClickListener() {
                                      @Override
                                      public void onClick(android.content.DialogInterface d, int w) {
                                          result.confirm();
                                      }
                                  })
                                  .setOnCancelListener(new android.content.DialogInterface.OnCancelListener() {
                                      @Override
                                      public void onCancel(android.content.DialogInterface d) {
                                          result.cancel();
                                      }
                                  })
                                  .show();
                          return true;
                      }

                      @Override
                      public boolean onJsConfirm(WebView view, String url, String message, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(message)
                                  .setPositiveButton(android.R.string.ok, new android.content.DialogInterface.OnClickListener() {
                                      @Override
                                      public void onClick(android.content.DialogInterface d, int w) {
                                          result.confirm();
                                      }
                                  })
                                  .setNegativeButton(android.R.string.cancel, new android.content.DialogInterface.OnClickListener() {
                                      @Override
                                      public void onClick(android.content.DialogInterface d, int w) {
                                          result.cancel();
                                      }
                                  })
                                  .setOnCancelListener(new android.content.DialogInterface.OnCancelListener() {
                                      @Override
                                      public void onCancel(android.content.DialogInterface d) {
                                          result.cancel();
                                      }
                                  })
                                  .show();
                          return true;
                      }

                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          webView.setVisibility(View.GONE);
                          root.addView(view, new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          root.removeView(customView);
                          customView = null;
                          webView.setVisibility(View.VISIBLE);
                          getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          if (customViewCallback != null) customViewCallback.onCustomViewHidden();
                          customViewCallback = null;
                      }
                  });

                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition,
                                                  String mimeType, long contentLength) {
                          try {
                              DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                              req.setMimeType(mimeType);
                              String cookies = CookieManager.getInstance().getCookie(url);
                              if (cookies != null) req.addRequestHeader("Cookie", cookies);
                              req.addRequestHeader("User-Agent", userAgent);
                              req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                              String name = URLUtil.guessFileName(url, contentDisposition, mimeType);
                              req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                              DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                              if (dm != null) {
                                  dm.enqueue(req);
                                  Toast.makeText(MainActivity.this, "Mengunduh " + name, Toast.LENGTH_SHORT).show();
                              }
                          } catch (Exception e) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              } catch (Exception ignored) {
                                  Toast.makeText(MainActivity.this, "Gagal mengunduh file", Toast.LENGTH_SHORT).show();
                              }
                          }
                      }
                  });

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(START_URL);
                  }
              }

              private boolean handleUrl(String url) {
                  if (url.startsWith("http://") || url.startsWith("https://") || url.startsWith("file://")
                          || url.startsWith("about:") || url.startsWith("javascript:") || url.startsWith("data:")) {
                      return false;
                  }
                  try {
                      Intent intent;
                      if (url.startsWith("intent:")) {
                          intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                          intent.addCategory(Intent.CATEGORY_BROWSABLE);
                          intent.setComponent(null);
                      } else {
                          intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      }
                      startActivity(intent);
                  } catch (Exception e) {
                      Toast.makeText(this, "Tidak ada aplikasi untuk membuka tautan ini", Toast.LENGTH_SHORT).show();
                  }
                  return true;
              }

              private void showOffline(WebView view, String failedUrl) {
                  String html = "<html><head><meta name='viewport' content='width=device-width,initial-scale=1'></head>"
                          + "<body style='font-family:sans-serif;text-align:center;padding:48px 24px;color:#444'>"
                          + "<h2>Tidak dapat terhubung</h2><p>Periksa koneksi internet lalu coba lagi.</p>"
                          + "<p><a href='" + failedUrl.replace("'", "%27") + "' style='display:inline-block;padding:12px 28px;"
                          + "background:#1E88E5;color:#fff;border-radius:24px;text-decoration:none'>Coba lagi</a></p>"
                          + "</body></html>";
                  view.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
              }

              private boolean hasAll(List<String> perms) {
                  if (Build.VERSION.SDK_INT < 23) return true;
                  for (String p : perms) {
                      if (checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) return false;
                  }
                  return true;
              }

              private void ask(List<String> perms) {
                  if (Build.VERSION.SDK_INT >= 23) {
                      requestPermissions(perms.toArray(new String[0]), REQ_PERM);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode != REQ_PERM) return;
                  boolean ok = grantResults.length > 0;
                  for (int g : grantResults) {
                      if (g != PackageManager.PERMISSION_GRANTED) ok = false;
                  }
                  if (pendingWebPermission != null) {
                      if (ok) pendingWebPermission.grant(pendingWebPermission.getResources());
                      else pendingWebPermission.deny();
                      pendingWebPermission = null;
                  }
                  if (pendingGeoCallback != null) {
                      pendingGeoCallback.invoke(pendingGeoOrigin, ok, false);
                      pendingGeoCallback = null;
                      pendingGeoOrigin = null;
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_FILE && filePathCallback != null) {
                      Uri[] result = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      filePathCallback.onReceiveValue(result);
                      filePathCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      webView.getWebChromeClient().onHideCustomView();
                  } else if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  webView.onPause();
                  CookieManager.getInstance().flush();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  webView.onResume();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      root.removeView(webView);
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
