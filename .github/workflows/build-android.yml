            local j; j="$(tcget java)"; [ -n "$j" ] && { use_java "$j" || true; }
            return 0
          }

          # build_with_heal: 0 = sukses | 1 = gagal | 2 = perbaikan meminta Flutter lain (NEXT_FLUTTER)
          build_with_heal() {
            local round=0 maxr=6 plain=0 mark v
            while :; do
              mark=$(wc -l < "$LOG")
              v=n; [ "$round" -ge $((maxr - 1)) ] && v=v
              if flutter_build "flutter build apk ($TYPE, $PERF) #$((round + 1))" "$v"; then return 0; fi
