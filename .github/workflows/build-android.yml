# ═══════════════════════════════════════════════════════════════════════════════
#  build-flutter.yml  —  Build APK universal untuk bot Telegram
#  Mendukung: Flutter (semua versi stable), Android Native (Gradle), Web → APK
#
#  Taruh di worker repo sebagai  .github/workflows/build-flutter.yml
#  (salin juga sebagai build-android.yml bila bot memakai slot workflow Android).
#
#  Kontrak dengan bot (server.js → triggerWorkflow):
#    inputs : jobId, userId, payload (JSON)
#    payload: mode=zip  → {url, buildType, perfMode, engine, tag}
#             mode=url  → {url, appName, iconUrl}   (Web → APK)
#    hasil  : artifact  apk-<jobId>   (berisi app-<tipe>.apk)
#    gagal  : artifact  diag-<jobId>  (log lengkap, ringkasan error, config, laporan Gradle)
#             + anotasi ::error di log job (dibaca bot lewat getFailedStepLog)
#
#  Otomatis (tanpa isi manual):
#    Flutter : versi dipilih dari .fvmrc / pubspec (sdk & flutter) memakai manifest rilis resmi;
#              cadangan: SDK seangkatan bila build pertama gagal
#    JDK     : 8 / 11 / 17 / 21 / 25 dari versi Gradle, AGP, toolchain, dan plugin
#    Gradle  : wrapper project; bila tidak ada, dipilih dari versi AGP
#    SDK/NDK : compileSdk, build-tools, NDK, CMake dibaca dari project + plugin Flutter lalu dipasang
#    Tambalan: gradlew CRLF, org.gradle.java.home milik PC lain, key.properties hilang, namespace
#              modul lama, AndroidX, local.properties, APK unsigned → ditandatangani
#    Penyelaras versi (compat.py, v11):
#              • Flutter dipilih dari constraint pubspec + kebutuhan SDK tiap dependency (pub.dev), bukan hanya environment.sdk
#              • Gradle wrapper / AGP / Kotlin otomatis dinaikkan ke syarat minimum Flutter SDK terpasang & syarat AGP
#              • build gagal → baca pesan error → perbaiki (Gradle/AGP/Kotlin/JDK/compileSdk/minSdk/NDK/CMake/build-tools/
#                lisensi SDK/memori/lint/R8/namespace/google-services) → ulang; bila perlu ganti versi Flutter
#  Override opsional di payload: flutterVersion, javaVersion, gradleVersion, ndkVersion,
#    compileSdk, buildTools, flavor, packageName, versionName
# ═══════════════════════════════════════════════════════════════════════════════
name: Build APK (Flutter • Android Native • Web2APK)
run-name: "Build ${{ inputs.jobId }}"

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "ID job dari bot"
        required: true
        type: string
      userId:
        description: "ID Telegram pengguna"
        required: false
        default: "0"
        type: string
      payload:
        description: "JSON konfigurasi build (dibuat bot)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.jobId }}
  cancel-in-progress: false

env:
  JOB_ID: ${{ inputs.jobId }}
  USER_ID: ${{ inputs.userId }}
  CI: "true"
  PUB_ENVIRONMENT: "bot_ci"
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: build-${{ inputs.jobId }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: "1a · Skrip bantu: deteksi & tambal project"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci" "$GITHUB_WORKSPACE/_diag" "$HOME/.android"
          cat > "$RUNNER_TEMP/ci/payload.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """payload.py - validasi payload dispatch dari bot -> variabel lingkungan untuk step berikutnya.

          Kontrak dengan bot (server.js):
            zip : {mode:"zip", url, buildType, perfMode, engine, tag}
            url : {mode:"url", url, appName, iconUrl}
          Opsional (override manual): flutterVersion, javaVersion, gradleVersion, ndkVersion, compileSdk,
            buildTools, flavor, packageName, versionName
          """
          import json, os, re, sys

          WS = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          raw = os.environ.get("PAYLOAD", "")


          def die(msg):
              print(f"::error title=Payload tidak valid::{msg}")
              sys.exit(1)


          try:
              p = json.loads(raw) if raw.strip() else {}
          except Exception as e:  # noqa
              die(f"JSON payload rusak ({e}). Isi (80 karakter pertama): {raw[:80]!r}")
          if not isinstance(p, dict):
              die("Payload harus berupa objek JSON.")


          def s(key, default=""):
              v = p.get(key, default)
              return default if v is None else re.sub(r"[\r\n]+", " ", str(v)).strip()


          url = s("url")
          mode = s("mode").lower()
          if mode not in ("zip", "url"):
              mode = "url" if (s("appName") and not url.lower().split("?")[0].endswith(".zip")) else "zip"
          if not url:
              die("Field 'url' kosong. Bot harus mengirim link ZIP source (mode zip) atau alamat website (mode url).")

          build_type = s("buildType", "release").lower()
          if build_type not in ("debug", "release"):
              build_type = "release"
          perf = s("perfMode", "fast").lower()
          if perf not in ("fast", "low"):
              perf = "fast"
          engine = s("engine", "auto").lower()
          if engine not in ("flutter", "native"):
              engine = "auto"

          env = {
              "BUILD_MODE": mode, "SRC_URL": url, "BUILD_TYPE": build_type, "PERF_MODE": perf, "ENGINE_HINT": engine,
              "APP_NAME": s("appName", "Web App"), "ICON_URL": s("iconUrl"), "PKG_NAME": s("packageName"),
              "VERSION_NAME": s("versionName", "1.0"), "TAG": s("tag"),
              "OVR_FLUTTER": s("flutterVersion"), "OVR_JAVA": s("javaVersion"), "OVR_GRADLE": s("gradleVersion"),
              "OVR_NDK": s("ndkVersion"), "OVR_COMPILE_SDK": s("compileSdk"), "OVR_BUILD_TOOLS": s("buildTools"),
              "OVR_FLAVOR": s("flavor"),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for k, v in env.items():
                  f.write(f"{k}={v}\n")
          for k in ("BUILD_MODE", "BUILD_TYPE", "PERF_MODE", "ENGINE_HINT", "APP_NAME"):
              print(f"  {k} = {env[k]}")
          print(f"  SRC_URL = {url[:90]}{'...' if len(url) > 90 else ''}")

          # ringkasan awal
          summ = os.environ.get("GITHUB_STEP_SUMMARY")
          if summ:
              with open(summ, "a", encoding="utf-8") as f:
                  f.write(f"### Build `{os.environ.get('JOB_ID', '-')}`\n\n| Item | Nilai |\n|---|---|\n"
                          f"| Mode | `{mode}` |\n| Tipe | `{build_type}` |\n| Profil | `{perf}` |\n| Engine (permintaan) | `{engine}` |\n")
          __CI_EOF__
          cat > "$RUNNER_TEMP/ci/detect.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """detect.py - deteksi project & toolchain untuk workflow build (Flutter / Android native / Web2APK).

          Subcommand:
            locate     cari root project di _extract -> pindah ke ./project, tentukan engine
            toolchain  tentukan versi Flutter, JDK, Gradle, compileSdk, build-tools, NDK, CMake, flavor
            plugins    (setelah flutter pub get) baca kebutuhan SDK/NDK dari plugin + default Flutter SDK
          """
          import json, os, re, shutil, sys, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed

          WS = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          PROJECT = os.path.join(WS, "project")
          EXTRACT = os.path.join(WS, "_extract")
          TC_JSON = os.path.join(WS, "_diag", "toolchain.json")
          SKIP_DIRS = {"build", ".gradle", "node_modules", ".dart_tool", ".git", "__MACOSX", ".idea", "ios", "macos",
                       "windows", "linux", "web", ".pub-cache", "Pods", ".fvm"}


          # ───────────────────────── util output ─────────────────────────
          def _append(path, text):
              if path:
                  with open(path, "a", encoding="utf-8") as f:
                      f.write(text)


          def out(k, v):
              v = "" if v is None else str(v).replace("\n", " ")
              _append(os.environ.get("GITHUB_OUTPUT"), f"{k}={v}\n")
              print(f"  {k} = {v}")


          def setenv(k, v):
              v = "" if v is None else str(v).replace("\n", " ")
              _append(os.environ.get("GITHUB_ENV"), f"{k}={v}\n")


          def notice(msg): print(f"::notice::{msg}")
          def warn(msg): print(f"::warning::{msg}")
          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)


          def read(path, limit=2_000_000):
              try:
                  if os.path.getsize(path) > limit:
                      return ""
                  with open(path, "r", encoding="utf-8", errors="replace") as f:
                      return f.read()
              except OSError:
                  return ""


          # ───────────────────────── versi & constraint ─────────────────────────
          def vparse(s):
              m = re.match(r"\s*v?(\d+)(?:\.(\d+))?(?:\.(\d+))?", str(s or ""))
              if not m:
                  return None
              return tuple(int(x) if x is not None else 0 for x in m.groups())


          def vstr(t):
              return ".".join(str(x) for x in t)


          def parse_constraint(s):
              """Dukung: ^1.2.3, >=1 <2, >=1, <2, <=, >, ==, versi tunggal, any. Return list[(op, tuple)]"""
              s = (s or "").strip().strip("'\"")
              if not s or s.lower() in ("any", "*"):
                  return []
              cons = []
              for tok in re.findall(r"(\^|>=|<=|==|>|<|=)?\s*v?(\d+(?:\.\d+){0,2})(?:-[\w.+-]+)?", s):
                  op, ver = tok
                  v = vparse(ver)
                  if not v:
                      continue
                  if op == "^":
                      cons.append((">=", v))
                      if v[0] > 0:
                          cons.append(("<", (v[0] + 1, 0, 0)))
                      elif v[1] > 0:
                          cons.append(("<", (0, v[1] + 1, 0)))
                      else:
                          cons.append(("<", (0, 0, v[2] + 1)))
                  elif op in ("", None):
                      cons.append(("==", v))
                  else:
                      cons.append(("==" if op == "=" else op, v))
              return cons


          def satisfies(v, cons):
              for op, c in cons:
                  if op == ">=" and not v >= c: return False
                  if op == ">" and not v > c: return False
                  if op == "<=" and not v <= c: return False
                  if op == "<" and not v < c: return False
                  if op == "==" and not v == c: return False
              return True


          def lower_bound(cons):
              lows = [c for op, c in cons if op in (">=", ">", "==")]
              return max(lows) if lows else None


          # ───────────────────────── baca project ─────────────────────────
          def walk_files(root, exts=None, names=None, max_files=600):
              n = 0
              for dp, dns, fns in os.walk(root):
                  dns[:] = [d for d in dns if d not in SKIP_DIRS and not d.startswith(".")]
                  for fn in fns:
                      ok = (names and fn in names) or (exts and any(fn.endswith(e) for e in exts))
                      if ok:
                          n += 1
                          if n > max_files:
                              return
                          yield os.path.join(dp, fn)


          def gradle_files(root):
              return list(walk_files(root, exts=(".gradle", ".gradle.kts", ".toml"),
                                     names=("gradle.properties", "gradle-wrapper.properties")))


          def pubspec_env(text):
              """Ambil environment.sdk & environment.flutter tanpa PyYAML."""
              res = {"sdk": "", "flutter": ""}
              lines = text.splitlines()
              for i, ln in enumerate(lines):
                  if re.match(r"^environment\s*:\s*$", ln):
                      for nxt in lines[i + 1:]:
                          if nxt.strip() == "" or nxt.lstrip().startswith("#"):
                              continue
                          if not nxt.startswith((" ", "\t")):
                              break
                          m = re.match(r"\s+(sdk|flutter)\s*:\s*(.+?)\s*(?:#.*)?$", nxt)
                          if m:
                              res[m.group(1)] = m.group(2).strip().strip("'\"")
                      break
              return res


          def is_flutter_pubspec(text):
              return bool(re.search(r"^\s*sdk\s*:\s*flutter\s*$", text, re.M) or re.search(r"^flutter\s*:", text, re.M))


          def scan_gradle_text(text, acc):
              for m in re.finditer(r"compileSdk(?:Version)?\s*(?:=|\(|\s)\s*(?:release\()?\s*(\d{2})\b", text):
                  acc["compile"].add(int(m.group(1)))
              for m in re.finditer(r"release\((\d{2})\)", text):
                  acc["compile"].add(int(m.group(1)))
              for m in re.finditer(r"\bminSdk(?:Version)?\s*(?:=|\(|\s)\s*(\d{2})\b", text):
                  acc["min_sdk"].add(int(m.group(1)))
              for m in re.finditer(r"buildToolsVersion\s*(?:=|\()?\s*[\"'](\d+(?:\.\d+){1,3})[\"']", text):
                  acc["tools"].add(m.group(1))
              for m in re.finditer(r"ndkVersion\s*(?:=|\()?\s*[\"'](\d+(?:\.\d+){1,3})[\"']", text):
                  acc["ndk"].add(m.group(1))
              for m in re.finditer(r"cmake\s*\{[^{}]*?version\s*(?:=)?\s*[\"'](\d+(?:\.\d+){1,3})[\"']", text, re.S):
                  acc["cmake"].add(m.group(1))
              if re.search(r"externalNativeBuild|ndkBuild|CMakeLists", text):
                  acc["native_code"] = True
              # JDK yang dibutuhkan toolchain/target
              for m in re.finditer(r"jvmToolchain\s*\(\s*(\d+)\s*\)", text):
                  acc["jdk_req"].add(int(m.group(1)))
              for m in re.finditer(r"JavaLanguageVersion\.of\(\s*(\d+)\s*\)", text):
                  acc["jdk_req"].add(int(m.group(1)))
              for m in re.finditer(r"JavaVersion\.VERSION_(\d+)(?:_(\d+))?", text):
                  a, b = m.group(1), m.group(2)
                  acc["jdk_req"].add(int(b) if a == "1" and b else int(a))
              for m in re.finditer(r"jvmTarget\s*=?\s*[\"'](?:1\.)?(\d+)[\"']", text):
                  acc["jdk_req"].add(int(m.group(1)))
              # AGP
              for m in re.finditer(r"com\.android\.tools\.build:gradle:(\d+\.\d+(?:\.\d+)?)", text):
                  acc["agp"].add(m.group(1))
              for m in re.finditer(r"[\"']com\.android\.(?:application|library)[\"']\s*\)?\s*version\s*\(?\s*[\"'](\d+\.\d+(?:\.\d+)?)", text):
                  acc["agp"].add(m.group(1))
              for m in re.finditer(r"^\s*(?:agp|androidGradlePlugin|android-gradle-plugin|android_gradle_plugin)\s*=\s*[\"'](\d+\.\d+(?:\.\d+)?)", text, re.M):
                  acc["agp"].add(m.group(1))
              for m in re.finditer(r"kotlin[_-]?version\s*=\s*[\"'](\d+\.\d+(?:\.\d+)?)[\"']", text, re.I):
                  acc["kotlin"].add(m.group(1))
              for m in re.finditer(r"org\.jetbrains\.kotlin\.android[\"']\s*\)?\s*version\s*\(?\s*[\"'](\d+\.\d+(?:\.\d+)?)", text):
                  acc["kotlin"].add(m.group(1))
              for m in re.finditer(r"^\s*kotlin\s*=\s*[\"'](\d+\.\d+(?:\.\d+)?)[\"']", text, re.M):
                  acc["kotlin"].add(m.group(1))
              m = re.search(r"distributionUrl\s*=.*?gradle-(\d+(?:\.\d+){1,2})(?:-rc-\d+)?-(?:bin|all)\.zip", text)
              if m:
                  acc["gradle_wrap"].add(m.group(1))


          def new_acc():
              return {"compile": set(), "tools": set(), "ndk": set(), "cmake": set(), "jdk_req": set(), "agp": set(),
                      "kotlin": set(), "gradle_wrap": set(), "native_code": False, "min_sdk": set()}


          def scan_project(root):
              acc = new_acc()
              for f in gradle_files(root):
                  scan_gradle_text(read(f), acc)
              return acc


          def vmax(items):
              best = None
              for it in items:
                  p = vparse(it)
                  if p and (best is None or p > best[0]):
                      best = (p, it)
              return best[1] if best else ""


          # ───────────────────────── Flutter version resolver ─────────────────────────
          MANIFEST_URL = "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json"
          # cadangan offline (Dart minor -> deret Flutter stable); dipakai kalau manifest tidak bisa diunduh
          FALLBACK_BY_DART = {
              (2, 12): "2.0.x", (2, 13): "2.2.x", (2, 14): "2.5.x", (2, 15): "2.8.x", (2, 16): "2.10.x", (2, 17): "3.0.x",
              (2, 18): "3.3.x", (2, 19): "3.7.x", (3, 0): "3.10.x", (3, 1): "3.13.x", (3, 2): "3.16.x", (3, 3): "3.19.x",
              (3, 4): "3.22.x", (3, 5): "3.24.x", (3, 6): "3.27.x", (3, 7): "3.29.x", (3, 8): "3.32.x",
              (3, 9): "3.35.x", (3, 10): "3.38.x", (3, 11): "3.41.x", (3, 12): "3.44.x", (3, 13): "3.47.x",
          }


          def load_releases():
              path = os.environ.get("FLUTTER_RELEASES_JSON")
              try:
                  if path and os.path.exists(path):
                      data = json.load(open(path, encoding="utf-8"))
                  else:
                      req = urllib.request.Request(MANIFEST_URL, headers={"User-Agent": "build-workflow"})
                      data = json.load(urllib.request.urlopen(req, timeout=25))
              except Exception as e:  # noqa
                  warn(f"Manifest rilis Flutter tidak bisa diambil ({e}); memakai tabel cadangan.")
                  return []
              rels = []
              for r in data.get("releases", []):
                  if r.get("channel") != "stable":
                      continue
                  fv, dv = vparse(r.get("version")), vparse(str(r.get("dart_sdk_version") or "").split(" ")[0])
                  if fv and dv:
                      rels.append((fv, dv))
              rels = sorted(set(rels))
              return rels


          PUB_API = "https://pub.dev/api/packages/"
          SKIP_PKGS = {"flutter", "flutter_test", "flutter_localizations", "flutter_web_plugins", "integration_test", "flutter_driver"}


          def pubspec_deps(text):
              """name -> constraint versi (paket hosted) dari dependencies & dev_dependencies."""
              deps, section, indent = {}, None, None
              for ln in text.splitlines():
                  if ln.strip() == "" or ln.lstrip().startswith("#"):
                      continue
                  if not ln.startswith((" ", "\t")):
                      m = re.match(r"^(dependencies|dev_dependencies)\s*:\s*(?:#.*)?$", ln)
                      section, indent = (m.group(1) if m else None), None
                      continue
                  if section is None:
                      continue
                  m = re.match(r"^([ \t]+)([A-Za-z_][\w\-]*)\s*:\s*(.*?)\s*(?:#.*)?$", ln)
                  if not m:
                      continue
                  if indent is None:
                      indent = m.group(1)
                  if m.group(1) != indent:
                      continue
                  name, val = m.group(2), m.group(3).strip().strip("'\"")
                  if name in SKIP_PKGS or not val:
                      continue
                  if re.match(r"^(\^|>=|>|<=|<|=|any\b|\d)", val):
                      deps[name] = val
              return deps


          def _pub_lowest(name, cons):
              """(dart_min, flutter_min) dari VERSI TERENDAH paket yang memenuhi constraint (batas bawah pasti)."""
              data = None
              for _ in range(2):
                  try:
                      req = urllib.request.Request(PUB_API + name, headers={"User-Agent": "build-workflow", "Accept": "application/vnd.pub.v2+json"})
                      data = json.load(urllib.request.urlopen(req, timeout=15))
                      break
                  except Exception:  # noqa
                      continue
              if not data:
                  return None
              best = None
              for v in data.get("versions", []):
                  ver = str(v.get("version", ""))
                  if "-" in ver or v.get("retracted"):
                      continue
                  p = vparse(ver)
                  if p and satisfies(p, cons) and (best is None or p < best[0]):
                      best = (p, v)
              if not best:
                  return None
              env = (best[1].get("pubspec") or {}).get("environment") or {}
              return lower_bound(parse_constraint(str(env.get("sdk") or ""))), lower_bound(parse_constraint(str(env.get("flutter") or "")))


          def deps_min_sdk(pub_text):
              """Batas bawah Dart/Flutter yang dibutuhkan dependency pubspec (mis. intl 0.20.3 -> Dart 3.9). Gagal jaringan -> (None, None)."""
              if os.environ.get("NO_PUB_API"):
                  return None, None
              deps = pubspec_deps(pub_text)
              dmin = fmin = None
              why = {}
              try:
                  with ThreadPoolExecutor(max_workers=8) as ex:
                      futs = {ex.submit(_pub_lowest, n, parse_constraint(c)): n for n, c in list(deps.items())[:120]}
                      for fu in as_completed(futs, timeout=90):
                          r = fu.result()
                          if not r:
                              continue
                          d, f = r
                          if d and (dmin is None or d > dmin):
                              dmin, why["dart"] = d, futs[fu]
                          if f and (fmin is None or f > fmin):
                              fmin, why["flutter"] = f, futs[fu]
              except Exception as e:  # noqa
                  warn(f"Analisis dependency via pub.dev tidak lengkap: {e}")
              if dmin:
                  print(f"Dependency membutuhkan Dart >= {vstr(dmin)} (penentu: {why.get('dart')})")
              if fmin:
                  print(f"Dependency membutuhkan Flutter >= {vstr(fmin)} (penentu: {why.get('flutter')})")
              return dmin, fmin


          def pick_candidates(rels, dcons, fcons, dmin=None, fmin=None):
              """Urutan Flutter yang dicoba: seangkatan terendah yang kompatibel (paling cocok dg umur dependency) -> terbaru -> tengah."""
              ok = [(f, d) for f, d in rels if satisfies(d, dcons) and satisfies(f, fcons)]
              if not ok:
                  return []
              strict = [(f, d) for f, d in ok if (not dmin or d >= dmin) and (not fmin or f >= fmin)]
              if strict:
                  ok = strict
              minors = sorted({d[:2] for _, d in ok})
              latest = lambda mn: max(f for f, d in ok if d[:2] == mn)  # noqa: E731
              order = [latest(minors[0]), max(f for f, _ in ok), latest(minors[len(minors) // 2])]
              seen, res = set(), []
              for f in order:
                  if f not in seen:
                      seen.add(f)
                      res.append(f)
              return res


          def resolve_flutter(project, ovr):
              """Return (primary, [alt...], channel, source)"""
              # 1) override eksplisit
              if ovr:
                  o = str(ovr).strip()
                  if o in ("stable", "beta", "master", "dev"):
                      return "", [], o, "payload"
                  return o.lstrip("v"), [], "stable", "payload"
              # 2) FVM / asdf
              for fn, pat in ((".fvmrc", r'"flutter"\s*:\s*"([^"]+)"'), (os.path.join(".fvm", "fvm_config.json"), r'"flutterSdkVersion"\s*:\s*"([^"]+)"'),
                              (".tool-versions", r"^\s*flutter\s+([\w.\-]+)")):
                  m = re.search(pat, read(os.path.join(project, fn)), re.M)
                  if m:
                      v = m.group(1).split("@")[-1].replace("-stable", "").strip()
                      if v in ("stable", "beta", "master", "dev"):
                          return "", [], v, fn
                      if vparse(v):
                          return v.lstrip("v"), [], "stable", fn
              # 3) constraint pubspec + kebutuhan SDK dari dependency
              pub = read(os.path.join(project, "pubspec.yaml"))
              env = pubspec_env(pub)
              dcons, fcons = parse_constraint(env["sdk"]), parse_constraint(env["flutter"])
              if not dcons and not fcons:
                  return "", [], "stable", "tidak ada constraint -> stable terbaru"
              dmin, fmin = deps_min_sdk(pub)
              rels = load_releases()
              if not rels:
                  low = max([x for x in (lower_bound(dcons), dmin) if x] or [None]) if (lower_bound(dcons) or dmin) else None
                  alt = FALLBACK_BY_DART.get((low[0], low[1])) if low else None
                  if alt:
                      return alt, [], "stable", "tabel cadangan"
                  return "", [], "stable", "tabel cadangan -> stable terbaru"
              cands = pick_candidates(rels, dcons, fcons, dmin, fmin)
              if not cands:
                  warn(f"Tidak ada Flutter stable yang cocok dengan sdk '{env['sdk']}' / flutter '{env['flutter']}'; memakai stable terbaru.")
                  return "", [], "stable", "constraint tidak terpenuhi"
              return vstr(cands[0]), [vstr(c) for c in cands[1:]], "stable", f"sdk '{env['sdk']}'" + (f" + dependency (Dart>={vstr(dmin)})" if dmin else "")


          # ───────────────────────── JDK & Gradle ─────────────────────────
          JDK_LTS = [8, 11, 17, 21, 25]


          def snap_jdk(n):
              for j in JDK_LTS:
                  if n <= j:
                      return j
              return JDK_LTS[-1]


          def choose_java(gradle_ver, agp_ver, jdk_req, flutter_ver, override):
              if override and str(override).strip().isdigit():
                  return snap_jdk(int(override))
              need = 8
              g = vparse(gradle_ver)
              if g:
                  if g >= (8, 0, 0): need = max(need, 17)
                  elif g >= (6, 0, 0): need = max(need, 11)
              a = vparse(agp_ver)
              if a:
                  if a >= (8, 0, 0): need = max(need, 17)
                  elif a >= (7, 0, 0): need = max(need, 11)
              f = vparse(flutter_ver)
              if f and f >= (3, 16, 0) and not g and not a:
                  need = max(need, 17)
              elif f and f >= (3, 7, 0) and not g and not a:
                  need = max(need, 11)
              if jdk_req:
                  need = max(need, max(jdk_req))
              if not g and not a and not f:
                  need = max(need, 17)
              return snap_jdk(need)


          AGP_TO_GRADLE = [  # (agp minimal, gradle yang dipakai kalau tidak ada wrapper)
              ((9, 0), "9.1.0"), ((8, 13), "8.13"), ((8, 12), "8.13"), ((8, 11), "8.13"), ((8, 10), "8.11.1"), ((8, 9), "8.11.1"),
              ((8, 8), "8.10.2"), ((8, 7), "8.9"), ((8, 6), "8.7"), ((8, 5), "8.7"), ((8, 4), "8.6"), ((8, 3), "8.4"),
              ((8, 2), "8.2"), ((8, 1), "8.0"), ((8, 0), "8.0"), ((7, 4), "7.5"), ((7, 3), "7.4"), ((7, 2), "7.3.3"),
              ((7, 1), "7.2"), ((7, 0), "7.0.2"), ((4, 2), "6.7.1"), ((4, 1), "6.5.1"), ((4, 0), "6.1.1"), ((3, 6), "5.6.4"),
              ((3, 5), "5.4.1"), ((3, 4), "5.1.1"), ((3, 3), "4.10.1"), ((3, 2), "4.6"), ((3, 1), "4.4"), ((3, 0), "4.1"),
          ]


          def gradle_for_agp(agp):
              a = vparse(agp)
              if not a:
                  return "8.14"
              for mn, g in AGP_TO_GRADLE:
                  if a[:2] >= mn:
                      return g
              return "4.1"


          # ───────────────────────── modul Android native ─────────────────────────
          APP_PLUGIN_RE = re.compile(r"com\.android\.application|android\.application|com\.android\.library.*application", re.I)


          def find_app_module(root):
              settings = ""
              for fn in ("settings.gradle", "settings.gradle.kts"):
                  settings = read(os.path.join(root, fn))
                  if settings:
                      break
              mods = []
              for m in re.finditer(r"include\s*\(?([^\n]+)", settings):
                  for q in re.findall(r"[\"']([^\"']+)[\"']", m.group(1)):
                      mods.append(q.lstrip(":"))
              cands = []
              for mod in mods:
                  d = os.path.join(root, *mod.split(":"))
                  for fn in ("build.gradle", "build.gradle.kts"):
                      txt = read(os.path.join(d, fn))
                      if txt and APP_PLUGIN_RE.search(txt):
                          cands.append(mod)
                          break
              if cands:
                  cands.sort(key=lambda m: (m != "app", len(m)))
                  return cands[0]
              for fn in ("build.gradle", "build.gradle.kts"):
                  if APP_PLUGIN_RE.search(read(os.path.join(root, fn))):
                      return ""
              return "app" if os.path.isdir(os.path.join(root, "app")) else ""


          def find_flavors(gradle_text):
              """Nama flavor dari blok productFlavors (satu dimensi)."""
              m = re.search(r"productFlavors\s*\{", gradle_text)
              if not m:
                  return [], 0
              dims = len(re.findall(r"flavorDimensions", gradle_text))
              i, depth, start = m.end(), 1, m.end()
              while i < len(gradle_text) and depth:
                  depth += {"{": 1, "}": -1}.get(gradle_text[i], 0)
                  i += 1
              block = gradle_text[start:i - 1]
              names, d, cur = [], 0, ""
              for line in block.splitlines():
                  if d == 0:
                      mm = re.match(r"\s*(?:create|register|maybeCreate)?\s*\(?[\"']?(\w+)[\"']?\)?\s*\{", line)
                      if mm:
                          names.append(mm.group(1))
                  d += line.count("{") - line.count("}")
              return [n for n in names if n not in ("dimension",)], dims


          # ───────────────────────── subcommand: locate ─────────────────────────
          def cmd_locate():
              hint = os.environ.get("ENGINE_HINT", "auto")
              if not os.path.isdir(EXTRACT):
                  fail("Folder hasil ekstrak tidak ada.")
              found = []
              for dp, dns, fns in os.walk(EXTRACT):
                  depth = dp[len(EXTRACT):].count(os.sep)
                  dns[:] = [d for d in dns if d not in SKIP_DIRS and not d.startswith(".")]
                  if depth > 4:
                      dns[:] = []
                  names = set(fns)
                  if "pubspec.yaml" in names and is_flutter_pubspec(read(os.path.join(dp, "pubspec.yaml"))):
                      found.append((depth, 0, dp, "flutter"))
                  if names & {"settings.gradle", "settings.gradle.kts"}:
                      found.append((depth, 1, dp, "native"))
              if not found:
                  listing = ", ".join(sorted(os.listdir(EXTRACT))[:15])
                  fail("Project tidak ditemukan di ZIP. Harus ada pubspec.yaml (Flutter) atau settings.gradle (Android native). "
                       f"Isi ZIP: {listing or '(kosong)'}")
              # Flutter menyimpan android/settings.gradle di dalam project; ambil yang paling dangkal.
              flutter = [f for f in found if f[3] == "flutter"]
              native = [f for f in found if f[3] == "native"]
              pick = None
              if hint == "native" and native:
                  pick = min(native)
              elif hint == "flutter" and flutter:
                  pick = min(flutter)
              elif flutter and native:
                  pick = min(flutter + native, key=lambda x: (x[0], x[1]))
                  # settings.gradle milik folder android/ dari project Flutter bukan project native
                  if pick[3] == "native" and os.path.basename(pick[2]) == "android" and flutter:
                      pick = min(flutter)
              else:
                  pick = min(flutter or native)
              engine = pick[3]
              if hint in ("flutter", "native") and hint != engine:
                  warn(f"Mode '{hint}' diminta, tetapi isi ZIP adalah project {engine}. Memakai {engine}.")
              if os.path.isdir(PROJECT):
                  shutil.rmtree(PROJECT)
              shutil.move(pick[2], PROJECT)
              shutil.rmtree(EXTRACT, ignore_errors=True)
              print(f"Project {engine} ditemukan (kedalaman {pick[0]}).")
              out("engine", engine)
              setenv("ENGINE", engine)
              if engine == "flutter":
                  need_create = not os.path.isdir(os.path.join(PROJECT, "android"))
                  out("flutter_create", "true" if need_create else "false")
                  if need_create:
                      notice("Folder android/ tidak ada di ZIP: akan dibuat dengan 'flutter create --platforms=android'.")


          # ───────────────────────── subcommand: toolchain ─────────────────────────
          def cmd_toolchain():
              engine = os.environ.get("ENGINE", "native")
              ovr = {k: os.environ.get(k, "").strip() for k in ("OVR_FLUTTER", "OVR_JAVA", "OVR_GRADLE", "OVR_NDK", "OVR_COMPILE_SDK", "OVR_BUILD_TOOLS", "OVR_FLAVOR")}
              acc = scan_project(PROJECT)
              if ovr["OVR_COMPILE_SDK"].isdigit():
                  acc["compile"].add(int(ovr["OVR_COMPILE_SDK"]))
              if ovr["OVR_NDK"]:
                  acc["ndk"].add(ovr["OVR_NDK"])
              if ovr["OVR_BUILD_TOOLS"]:
                  acc["tools"].add(ovr["OVR_BUILD_TOOLS"])

              flutter_v = flutter_alt = ""
              flutter_alts = []
              channel, src = "stable", ""
              if engine == "flutter":
                  flutter_v, flutter_alts, channel, src = resolve_flutter(PROJECT, ovr["OVR_FLUTTER"])
                  flutter_alt = flutter_alts[0] if flutter_alts else ""
                  print(f"Flutter: {flutter_v or channel} (alt: {' '.join(flutter_alts) or '-'}) <- {src}")

              wrapper = os.path.join(PROJECT, "android" if engine == "flutter" else "", "gradlew")
              if engine == "native":
                  # root project native bisa berada di PROJECT langsung
                  wrapper = os.path.join(PROJECT, "gradlew")
              # wrapper dianggap ada HANYA bila gradlew DAN gradle/wrapper/gradle-wrapper.jar lengkap
              # (jar hilang -> "Could not find or load main class org.gradle.wrapper.GradleWrapperMain")
              has_wrapper = os.path.exists(wrapper) and os.path.exists(
                  os.path.join(os.path.dirname(wrapper), "gradle", "wrapper", "gradle-wrapper.jar"))
              gradle_wrap = vmax(acc["gradle_wrap"])
              agp = vmax(acc["agp"])
              gradle_for_java = gradle_wrap or (gradle_for_agp(agp) if agp else "")
              java = choose_java(gradle_for_java, agp, acc["jdk_req"], flutter_v or flutter_alt, ovr["OVR_JAVA"])
              gradle_ver = ovr["OVR_GRADLE"] or ("" if has_wrapper else gradle_for_agp(agp))

              flavor = ovr["OVR_FLAVOR"]
              if engine == "flutter" and not flavor:
                  for fn in ("build.gradle", "build.gradle.kts"):
                      names, dims = find_flavors(read(os.path.join(PROJECT, "android", "app", fn)))
                      if names:
                          if dims > 1:
                              warn("Project memakai lebih dari satu flavorDimensions; flavor tidak dipilih otomatis (kirim payload.flavor).")
                          else:
                              flavor = names[0]
                              notice(f"Flavor terdeteksi: {', '.join(names)} -> memakai '{flavor}'.")
                          break

              app_module = find_app_module(PROJECT) if engine == "native" else "app"
              tc = {
                  "engine": engine, "flutter": flutter_v, "flutter_alt": flutter_alt, "flutter_alts": flutter_alts, "channel": channel, "java": java,
                  "gradle": gradle_ver, "has_wrapper": has_wrapper, "agp": agp, "kotlin": vmax(acc["kotlin"]),
                  "compile": sorted(acc["compile"]), "tools": sorted(acc["tools"]), "ndk": sorted(acc["ndk"]),
                  "cmake": sorted(acc["cmake"]), "native_code": acc["native_code"], "flavor": flavor,
                  "app_module": app_module, "gradle_wrapper_version": gradle_wrap,
              }
              os.makedirs(os.path.dirname(TC_JSON), exist_ok=True)
              json.dump(tc, open(TC_JSON, "w", encoding="utf-8"), indent=2)
              print("::group::Hasil deteksi toolchain")
              print(json.dumps(tc, indent=2))
              print("::endgroup::")
              for k in ("flutter", "flutter_alt", "channel", "java", "gradle", "flavor", "app_module"):
                  out(k, tc[k])
              out("flutter_alts", " ".join(flutter_alts))
              out("has_wrapper", "true" if has_wrapper else "false")
              out("agp", agp)
              out("gradle_wrapper_version", gradle_wrap)
              out("flutter_selector", flutter_v or "")  # versi eksak untuk flutter-action ('' = channel terbaru)
              out("compile_sdks", ",".join(map(str, tc["compile"])))


          # ───────────────────────── subcommand: plugins ─────────────────────────
          def cmd_plugins():
              tc = json.load(open(TC_JSON, encoding="utf-8"))
              acc = new_acc()
              acc["compile"].update(tc.get("compile", []))
              acc["tools"].update(tc.get("tools", []))
              acc["ndk"].update(tc.get("ndk", []))
              acc["cmake"].update(tc.get("cmake", []))
              jdk_req = set()
              plugin_min = set()
              # default Flutter SDK (flutter.compileSdkVersion / flutter.ndkVersion)
              froot = os.environ.get("FLUTTER_ROOT") or ""
              if not froot:
                  import shutil as sh
                  fb = sh.which("flutter")
                  froot = os.path.dirname(os.path.dirname(os.path.realpath(fb))) if fb else ""
              gdir = os.path.join(froot, "packages", "flutter_tools", "gradle", "src", "main")
              uses_flutter_default = False
              app_gradle = read(os.path.join(PROJECT, "android", "app", "build.gradle")) + read(os.path.join(PROJECT, "android", "app", "build.gradle.kts"))
              if re.search(r"flutter\.compileSdkVersion|flutter\.compileSdk\b", app_gradle) or not acc["compile"]:
                  uses_flutter_default = True
              if os.path.isdir(gdir):
                  for f in walk_files(gdir, exts=(".groovy", ".kt", ".gradle", ".kts")):
                      t = read(f)
                      if uses_flutter_default:
                          for m in re.finditer(r"compileSdkVersion\s*(?::\s*Int\s*)?=\s*(\d{2})", t):
                              acc["compile"].add(int(m.group(1)))
                          for m in re.finditer(r"ndkVersion\s*(?::\s*String\s*)?=\s*\"(\d+(?:\.\d+){1,3})\"", t):
                              if re.search(r"flutter\.ndkVersion", app_gradle):
                                  acc["ndk"].add(m.group(1))
              # plugin Flutter dari package_config.json
              pc = os.path.join(PROJECT, ".dart_tool", "package_config.json")
              n_scan = 0
              try:
                  pkgs = json.load(open(pc, encoding="utf-8")).get("packages", [])
                  base = os.path.dirname(pc)
                  for p in pkgs:
                      uri = p.get("rootUri", "")
                      if uri.startswith("file://"):
                          d = urllib.request.url2pathname(uri[7:])
                      else:
                          d = os.path.normpath(os.path.join(base, uri))
                      adir = os.path.join(d, "android")
                      if os.path.isdir(adir):
                          for fn in ("build.gradle", "build.gradle.kts"):
                              t = read(os.path.join(adir, fn))
                              if t:
                                  n_scan += 1
                                  sub = new_acc()
                                  scan_gradle_text(t, sub)
                                  acc["compile"] |= sub["compile"]; acc["tools"] |= sub["tools"]
                                  acc["ndk"] |= sub["ndk"]; acc["cmake"] |= sub["cmake"]
                                  if sub["native_code"]: acc["native_code"] = True
                                  jdk_req |= sub["jdk_req"]
                                  plugin_min |= sub["min_sdk"]
              except Exception as e:  # noqa
                  warn(f"package_config.json tidak terbaca: {e}")
              tc.update({"compile": sorted(acc["compile"]), "tools": sorted(acc["tools"]), "ndk": sorted(acc["ndk"]),
                         "cmake": sorted(acc["cmake"]), "native_code": acc["native_code"], "plugins_scanned": n_scan,
                         "plugin_min_sdk": max(plugin_min) if plugin_min else 0})
              new_java = choose_java(tc.get("gradle_wrapper_version") or "", tc.get("agp") or "", set(tc.get("jdk_req", [])) | jdk_req,
                                     tc.get("flutter") or tc.get("flutter_alt"), os.environ.get("OVR_JAVA", ""))
              if new_java > int(tc.get("java", 0)):
                  warn(f"Plugin membutuhkan JDK {new_java} (terdeteksi sebelumnya {tc['java']}).")
                  tc["java"] = new_java
              json.dump(tc, open(TC_JSON, "w", encoding="utf-8"), indent=2)
              print(f"Plugin dipindai: {n_scan}")
              out("java", tc["java"])
              out("compile_sdks", ",".join(map(str, tc["compile"])))


          if __name__ == "__main__":
              cmd = sys.argv[1] if len(sys.argv) > 1 else ""
              {"locate": cmd_locate, "toolchain": cmd_toolchain, "plugins": cmd_plugins}.get(cmd, lambda: fail(f"subcommand tidak dikenal: {cmd}"))()
          __CI_EOF__
          cat > "$RUNNER_TEMP/ci/prepare.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """prepare.py - tambal ringan agar project hasil ZIP bisa dibuild di runner (tidak mengubah logika aplikasi)."""
          import json, os, re, stat, sys

          WS = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          PROJECT = os.path.join(WS, "project")
          TC = os.path.join(WS, "_diag", "toolchain.json")
          ENGINE = os.environ.get("ENGINE", "native")
          HOME = os.path.expanduser("~")
          fixes = []


          def note(msg):
              fixes.append(msg)
              print(f"::notice::[prepare] {msg}")


          def read(p):
              try:
                  with open(p, "r", encoding="utf-8-sig", errors="replace") as f:
                      return f.read()
              except OSError:
                  return ""


          def write(p, s):
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w", encoding="utf-8", newline="\n") as f:
                  f.write(s)


          gradle_root = os.path.join(PROJECT, "android") if ENGINE == "flutter" else PROJECT
          tc = {}
          try:
              tc = json.load(open(TC, encoding="utf-8"))
          except Exception:
              pass


          def fix_wrapper():
              gw = os.path.join(gradle_root, "gradlew")
              if os.path.exists(gw):
                  raw = open(gw, "rb").read()
                  if b"\r\n" in raw:
                      open(gw, "wb").write(raw.replace(b"\r\n", b"\n"))
                      note("gradlew: CRLF diubah ke LF")
                  os.chmod(gw, os.stat(gw).st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
              wp = os.path.join(gradle_root, "gradle", "wrapper", "gradle-wrapper.properties")
              if os.path.exists(wp):
                  raw = open(wp, "rb").read()
                  txt = raw.decode("utf-8-sig", errors="replace").replace("\r\n", "\n")
                  new = txt
                  m = re.search(r"distributionUrl\s*=\s*(.+)", new)
                  if m and m.group(1).strip().replace("\\", "").lower().startswith(("file:", "http:")):
                      ver = re.search(r"gradle-(\d+(?:\.\d+){1,2})", m.group(1))
                      if ver:
                          new = new.replace(m.group(1), f"https\\://services.gradle.org/distributions/gradle-{ver.group(1)}-bin.zip")
                          note("distributionUrl wrapper diarahkan ke services.gradle.org (https)")
                  if new.encode() != raw:
                      write(wp, new)
                      note("gradle-wrapper.properties dirapikan (BOM/CRLF)")


          def fix_gradle_properties():
              for gp in {os.path.join(gradle_root, "gradle.properties"), os.path.join(PROJECT, "gradle.properties")}:
                  if not os.path.exists(gp):
                      continue
                  txt = read(gp).replace("\r\n", "\n")
                  new = txt
                  # jalur JDK milik PC pembuat project (C:\Program Files\..., /Users/...) pasti tidak ada di runner
                  for m in list(re.finditer(r"^\s*org\.gradle\.java\.home\s*=\s*(.+)$", new, re.M)):
                      if not os.path.isdir(m.group(1).strip()):
                          new = new.replace(m.group(0), "# (dinonaktifkan CI) " + m.group(0))
                          note("org.gradle.java.home menunjuk ke jalur yang tidak ada -> dinonaktifkan")
                  for m in list(re.finditer(r"^\s*(systemProp\.(?:http|https)\.proxy\w+)\s*=.*$", new, re.M)):
                      new = new.replace(m.group(0), "# (dinonaktifkan CI) " + m.group(0))
                      note("Pengaturan proxy lokal di gradle.properties dinonaktifkan")
                  # AndroidX
                  has_x = re.search(r"^\s*android\.useAndroidX\s*=", new, re.M)
                  agp = tc.get("agp") or ""
                  agp_t = tuple(int(x) for x in re.findall(r"\d+", agp)[:2]) if agp else (9, 9)
                  if not has_x and (ENGINE == "flutter" or agp_t >= (3, 2)):
                      new = new.rstrip("\n") + "\nandroid.useAndroidX=true\n"
                      if not re.search(r"^\s*android\.enableJetifier\s*=", new, re.M):
                          new += "android.enableJetifier=true\n"
                      note("android.useAndroidX/enableJetifier ditambahkan")
                  if new != txt:
                      write(gp, new)


          def ensure_gradle_properties():
              """Kalau project tidak punya gradle.properties sama sekali, buat minimal."""
              gp = os.path.join(gradle_root, "gradle.properties")
              if not os.path.exists(gp):
                  extra = "android.useAndroidX=true\nandroid.enableJetifier=true\n" if (ENGINE == "flutter") else ""
                  write(gp, "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\n" + extra)
                  note("gradle.properties dibuat (project tidak punya)")


          def suppress_compile_sdk():
              comp = tc.get("compile") or []
              if not comp:
                  return
              gp = os.path.join(gradle_root, "gradle.properties")
              txt = read(gp)
              if "android.suppressUnsupportedCompileSdk" not in txt:
                  wanted = ",".join(str(x) for x in sorted(set(comp) | {max(comp)}))
                  write(gp, txt.rstrip("\n") + f"\nandroid.suppressUnsupportedCompileSdk={wanted}\n")
                  note(f"android.suppressUnsupportedCompileSdk={wanted} (AGP lama + compileSdk baru tidak akan menghentikan build)")


          def local_properties():
              lp = os.path.join(gradle_root, "local.properties")
              sdk = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or ""
              lines = []
              for ln in read(lp).splitlines():
                  if re.match(r"\s*(sdk\.dir|flutter\.sdk|ndk\.dir|cmake\.dir)\s*=", ln):
                      continue
                  lines.append(ln)
              if sdk:
                  lines.append(f"sdk.dir={sdk}")
              fr = os.environ.get("FLUTTER_ROOT", "")
              if not fr:
                  import shutil as _sh
                  fb = _sh.which("flutter")
                  fr = os.path.dirname(os.path.dirname(os.path.realpath(fb))) if fb else ""
              if ENGINE == "flutter" and fr:
                  lines.append(f"flutter.sdk={fr}")
              write(lp, "\n".join(l for l in lines if l is not None) + "\n")
              note("local.properties diperbarui (sdk.dir/flutter.sdk milik runner)")


          def key_properties():
              ks = os.path.join(HOME, ".android", "ci-release.jks")
              scan = []
              for base in (gradle_root, os.path.join(gradle_root, "app")):
                  for fn in ("build.gradle", "build.gradle.kts"):
                      scan.append(read(os.path.join(base, fn)))
              joined = "\n".join(scan)
              kp = os.path.join(gradle_root, "key.properties")
              if "key.properties" in joined and not os.path.exists(kp) and os.path.exists(ks):
                  write(kp, f"storePassword=android\nkeyPassword=android\nkeyAlias=ci\nstoreFile={ks}\n")
                  note("key.properties dibuat dengan keystore sementara (project merujuk file itu tetapi tidak menyertakannya)")


          def namespace_fix():
              """AGP 8+ mewajibkan namespace di modul app. Ambil dari package= di AndroidManifest bila belum ada."""
              mods = [os.path.join(gradle_root, "app")] if ENGINE == "flutter" else []
              am = tc.get("app_module")
              if ENGINE == "native":
                  mods = [os.path.join(gradle_root, *am.split(":"))] if am else [gradle_root]
              agp = tc.get("agp") or "8.0"
              agp_t = tuple(int(x) for x in re.findall(r"\d+", agp)[:2]) or (8, 0)
              if agp_t < (7, 3):
                  return
              for mod in mods:
                  for fn in ("build.gradle", "build.gradle.kts"):
                      p = os.path.join(mod, fn)
                      txt = read(p)
                      if not txt or re.search(r"\bnamespace\b", txt):
                          continue
                      mf = read(os.path.join(mod, "src", "main", "AndroidManifest.xml"))
                      m = re.search(r"package\s*=\s*\"([\w.]+)\"", mf)
                      if not m:
                          continue
                      kts = fn.endswith(".kts")
                      repl = re.sub(r"(\bandroid\s*\{)", r"\1\n    namespace" + (' = "' if kts else ' "') + m.group(1) + '"', txt, count=1)
                      if repl != txt:
                          write(p, repl)
                          note(f"namespace '{m.group(1)}' ditambahkan ke {os.path.relpath(p, PROJECT)}")


          INIT_SCRIPT = r'''// Dipasang otomatis oleh workflow CI: beri namespace ke modul lama (plugin) yang belum punya.
          allprojects {
              afterEvaluate { p ->
                  def ext = p.extensions.findByName('android')
                  if (ext != null && ext.hasProperty('namespace')) {
                      def ns = ext.namespace
                      if (ns == null || ns.toString().isEmpty()) {
                          def mf = new File(p.projectDir, 'src/main/AndroidManifest.xml')
                          if (mf.exists()) {
                              def m = (mf.text =~ /package\s*=\s*"([^"]+)"/)
                              if (m.find()) {
                                  ext.namespace = m.group(1)
                                  p.logger.lifecycle("[ci] namespace ${m.group(1)} diset otomatis untuk ${p.name}")
                              }
                          }
                      }
                  }
              }
          }
          '''


          def user_gradle():
              gh = os.environ.get("GRADLE_USER_HOME") or os.path.join(HOME, ".gradle")
              os.makedirs(os.path.join(gh, "init.d"), exist_ok=True)
              write(os.path.join(gh, "init.d", "ci-namespace.gradle"), INIT_SCRIPT)
              perf = os.environ.get("PERF_MODE", "fast")
              lines = [
                  "org.gradle.daemon=true",
                  "org.gradle.parallel=true",
                  "org.gradle.caching=true",
                  f"org.gradle.workers.max={2 if perf == 'low' else 4}",
                  "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8",
                  "kotlin.incremental=true",
                  "kotlin.daemon.jvmargs=-Xmx2g",
                  "kotlin.jvm.target.validation.mode=warning",
                  "org.gradle.internal.http.connectionTimeout=90000",
                  "org.gradle.internal.http.socketTimeout=90000",
                  "org.gradle.java.installations.auto-detect=true",
                  "org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64",
              ]
              write(os.path.join(gh, "gradle.properties"), "\n".join(lines) + "\n")
              note("~/.gradle/gradle.properties + init script namespace dipasang")


          def missing_resources_fix():
              """Manifest merujuk @mipmap/xxx (mis. activity-alias ic_theme_*) yang file-nya tidak ikut di ZIP
              -> AAPT 'resource mipmap/xxx not found'. Buat pengganti dari ic_launcher (atau vektor polos)."""
              import shutil
              made = 0
              for root, dirs, files in os.walk(gradle_root):
                  dirs[:] = [d for d in dirs if d not in ("build", ".gradle", ".git", "node_modules", "intermediates")]
                  if "AndroidManifest.xml" not in files or not root.replace("\\", "/").endswith("src/main"):
                      continue
                  res = os.path.join(root, "res")
                  txt = read(os.path.join(root, "AndroidManifest.xml")) or ""
                  refs = set(re.findall(r"@mipmap/([A-Za-z0-9_]+)", txt))
                  icon_refs = set(re.findall(r'android:(?:icon|roundIcon|logo)\s*=\s*"@drawable/([A-Za-z0-9_]+)"', txt))
                  if not refs and not icon_refs:
                      continue
                  have = {}
                  if os.path.isdir(res):
                      for d in os.listdir(res):
                          p = os.path.join(res, d)
                          if os.path.isdir(p) and (d.startswith("mipmap") or d.startswith("drawable")):
                              for f in os.listdir(p):
                                  have.setdefault((d.split("-")[0], os.path.splitext(f)[0]), []).append((d, f))
                  def base_files():
                      for cand in ("ic_launcher", "ic_launcher_round", "ic_launcher_foreground"):
                          if have.get(("mipmap", cand)):
                              return have[("mipmap", cand)]
                      return []
                  vec = ('<?xml version="1.0" encoding="utf-8"?>\n'
                         '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" '
                         'android:viewportWidth="108" android:viewportHeight="108">\n'
                         '  <path android:fillColor="#1E88E5" android:pathData="M0,0h108v108h-108z"/>\n'
                         '  <path android:fillColor="#FFFFFF" android:pathData="M54,30a24,24 0 1,0 0.1,0z"/>\n</vector>\n')
                  todo = [("mipmap", n) for n in sorted(refs)] + [("drawable", n) for n in sorted(icon_refs)]
                  for kind, name in todo:
                      if have.get((kind, name)) or have.get(("mipmap", name)) or have.get(("drawable", name)):
                          continue
                      # resource bisa juga didefinisikan di values/*.xml
                      vals = os.path.join(res, "values")
                      if os.path.isdir(vals) and any(re.search(r'name="%s"' % re.escape(name), read(os.path.join(vals, f)) or "") for f in os.listdir(vals)):
                          continue
                      src = base_files()
                      if src:
                          for d, f in src:
                              ext = os.path.splitext(f)[1]
                              os.makedirs(os.path.join(res, d), exist_ok=True)
                              shutil.copyfile(os.path.join(res, d, f), os.path.join(res, d, name + ext))
                      else:
                          d = "mipmap-anydpi-v26" if kind == "mipmap" else "drawable"
                          os.makedirs(os.path.join(res, d), exist_ok=True)
                          write(os.path.join(res, d, name + ".xml"), vec)
                      made += 1
                      note(f"resource @{kind}/{name} dirujuk manifest tapi tidak ada -> dibuat pengganti ({'salinan ic_launcher' if src else 'ikon vektor polos'})")
              if made:
                  print(f"::warning::[prepare] {made} resource ikon yang hilang dibuat otomatis (aman; ikon alias akan sama dengan ikon utama)")


          if __name__ == "__main__":
              if not os.path.isdir(gradle_root):
                  print("::notice::[prepare] folder gradle belum ada (menunggu flutter create)")
              else:
                  fix_wrapper()
                  ensure_gradle_properties()
                  fix_gradle_properties()
                  suppress_compile_sdk()
                  local_properties()
                  key_properties()
                  namespace_fix()
                  missing_resources_fix()
              user_gradle()
              print(f"[prepare] selesai: {len(fixes)} perbaikan")
          __CI_EOF__
          cat > "$RUNNER_TEMP/ci/compat.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """compat.py - penyelaras versi toolchain agar project lama/baru bisa dibuild (JDK • Gradle • AGP • Kotlin • SDK • NDK • Flutter).

          Subcommand:
            reqs                       baca syarat minimum Gradle/AGP/Kotlin/Java dari Flutter SDK terpasang -> _diag/flutter_reqs.json
                                       (+ naikkan JDK di toolchain.json bila perlu; output `java` untuk setup-java)
            patch                      penyelarasan PROAKTIF di project: wrapper Gradle, AGP, Kotlin, minSdk plugin, NDK tertinggi
            heal <log>                 baca log build yang gagal -> terapkan perbaikan REAKTIF (project / JDK / paket SDK / Flutter / flag).
                                       Menulis $RUNNER_TEMP/heal.sh (HEAL_JAVA, HEAL_SDK, HEAL_FLUTTER, HEAL_FLAGS). Exit 0 = ada perubahan baru.
            next-flutter <log> <v>...  pilih versi Flutter berikutnya setelah `flutter pub get` gagal (v... = yang sudah dicoba)

          Semua langkah bersifat best-effort: tidak pernah menghentikan workflow sendiri.
          """
          import json, os, re, subprocess, sys, urllib.request

          sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
          import detect as D  # noqa: E402  (skrip bersaudara di folder yang sama)

          WS = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          PROJECT = os.path.join(WS, "project")
          DIAG = os.path.join(WS, "_diag")
          TC_JSON = os.path.join(DIAG, "toolchain.json")
          REQS_JSON = os.path.join(DIAG, "flutter_reqs.json")
          STATE_JSON = os.path.join(DIAG, "heal-state.json")
          ENGINE = os.environ.get("ENGINE", "native")
          TMP = os.environ.get("RUNNER_TEMP", "/tmp")
          HOME = os.path.expanduser("~")
          GRADLE_ROOT = os.path.join(PROJECT, "android") if ENGINE == "flutter" else PROJECT
          vparse, vstr = D.vparse, D.vstr


          def note(msg):
              print(f"::notice::[compat] {msg}")


          def warn(msg):
              print(f"::warning::[compat] {msg}")


          def rd(p):
              try:
                  with open(p, "r", encoding="utf-8-sig", errors="replace") as f:
                      return f.read()
              except OSError:
                  return ""


          def wr(p, s):
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w", encoding="utf-8", newline="\n") as f:
                  f.write(s)


          def jload(p, default):
              try:
                  with open(p, encoding="utf-8") as f:
                      return json.load(f)
              except Exception:  # noqa
                  return default


          def jsave(p, obj):
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w", encoding="utf-8") as f:
                  json.dump(obj, f, indent=2)


          def lt(a, b):
              pa, pb = vparse(a), vparse(b)
              return bool(pa and pb and pa < pb)


          def vmax2(*vals):
              vals = [v for v in vals if v and vparse(v)]
              return max(vals, key=vparse) if vals else ""


          def tc_load():
              return jload(TC_JSON, {})


          # ───────────────────────── berkas gradle project ─────────────────────────
          def gradle_text_files():
              return [p for p in D.walk_files(GRADLE_ROOT, exts=(".gradle", ".gradle.kts", ".toml"))]


          def app_gradle_files():
              tc = tc_load()
              if ENGINE == "flutter":
                  mods = [os.path.join(GRADLE_ROOT, "app")]
              else:
                  am = tc.get("app_module") or ""
                  mods = [os.path.join(GRADLE_ROOT, *am.split(":"))] if am else [GRADLE_ROOT]
              res = []
              for m in mods:
                  for fn in ("build.gradle", "build.gradle.kts"):
                      p = os.path.join(m, fn)
                      if os.path.exists(p):
                          res.append(p)
              return res


          def sub_versions(text, regexes, target):
              """Ganti versi < target dengan target. Return (teks_baru, [versi_lama])."""
              olds = []

              def mk(rx):
                  def rep(m):
                      old = m.group(2)
                      if lt(old, target):
                          olds.append(old)
                          return m.group(1) + target + m.group(3)
                      return m.group(0)
                  return rep

              for rx in regexes:
                  text = rx.sub(mk(rx), text)
              return text, olds


          V = r"(\d+\.\d+(?:\.\d+)?(?:-[\w.]+)?)"
          AGP_RES = [
              re.compile(r"""(\bid\s*\(?\s*["']com\.android\.[\w\-]+["']\s*\)?\s*version\s*\(?\s*["'])""" + V + r"""(["'])"""),
              re.compile(r"""(com\.android\.tools\.build:gradle:)""" + V + r"""()"""),
              re.compile(r"""(^\s*(?:agp|androidGradlePlugin|android-gradle-plugin|android_gradle_plugin)\s*=\s*["'])""" + V + r"""(["'])""", re.M),
          ]
          KGP_RES = [
              re.compile(r"""(\bid\s*\(?\s*["'](?:org\.jetbrains\.kotlin\.(?:android|jvm)|kotlin-android)["']\s*\)?\s*version\s*\(?\s*["'])""" + V + r"""(["'])"""),
              re.compile(r"""(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)""" + V + r"""()"""),
              re.compile(r"""(^\s*(?:ext\.)?kotlin_version\s*=\s*["'])""" + V + r"""(["'])""", re.M),
              re.compile(r"""(^\s*kotlin\s*=\s*["'])""" + V + r"""(["'])""", re.M),
          ]


          def bump_plugin(regexes, target, label):
              done = False
              for p in gradle_text_files():
                  t = rd(p)
                  nt, olds = sub_versions(t, regexes, target)
                  if olds:
                      wr(p, nt)
                      note(f"{label} {', '.join(sorted(set(olds)))} -> {target} di {os.path.relpath(p, PROJECT)}")
                      done = True
              return done


          def bump_agp(target):
              return bump_plugin(AGP_RES, target, "AGP")


          def bump_kgp(target):
              return bump_plugin(KGP_RES, target, "Kotlin")


          # ───────────────────────── Gradle wrapper ─────────────────────────
          def norm_gradle(v):
              t = vparse(v) or (8, 0, 0)
              if t[0] >= 9:
                  return f"{t[0]}.{t[1]}.{t[2]}"
              return f"{t[0]}.{t[1]}" + (f".{t[2]}" if t[2] else "")


          def gradle_exists(v):
              if os.environ.get("NO_NET"):
                  return None
              try:
                  req = urllib.request.Request(f"https://services.gradle.org/distributions/gradle-{v}-bin.zip", method="HEAD", headers={"User-Agent": "build-workflow"})
                  return urllib.request.urlopen(req, timeout=12).status < 400
              except Exception as e:  # noqa
                  return False if getattr(e, "code", 0) == 404 else None


          def bump_gradle(target, why=""):
              wp = os.path.join(GRADLE_ROOT, "gradle", "wrapper", "gradle-wrapper.properties")
              txt = rd(wp)
              if not txt:
                  return False
              m = re.search(r"distributionUrl\s*=\s*(.+)", txt)
              cur = re.search(r"gradle-(\d+(?:\.\d+){1,2})(?:-rc-\d+)?-(bin|all)\.zip", m.group(1)) if m else None
              if not cur or not lt(cur.group(1), target):
                  return False
              tgt = norm_gradle(target)
              if gradle_exists(tgt) is False:  # beberapa versi resmi memakai penulisan lain (8.14 vs 8.14.0)
                  alt = tgt[:-2] if tgt.endswith(".0") else tgt + ".0"
                  if gradle_exists(alt):
                      tgt = alt
              url = f"https\\://services.gradle.org/distributions/gradle-{tgt}-{cur.group(2)}.zip"
              txt = re.sub(r"(distributionUrl\s*=\s*).+", lambda mm: mm.group(1) + url, txt, count=1)
              txt = re.sub(r"^\s*distributionSha256Sum\s*=.*\n?", "", txt, flags=re.M)
              wr(wp, txt)
              note(f"Gradle wrapper {cur.group(1)} -> {tgt}" + (f" ({why})" if why else ""))
              return True


          def project_agp():
              acc = D.scan_project(PROJECT)
              return D.vmax(acc["agp"]), D.vmax(acc["kotlin"])


          def ensure_gradle(reqs=None, why="syarat AGP/Flutter"):
              agp, _ = project_agp()
              need = vmax2((reqs or {}).get("gradle_min", ""), D.gradle_for_agp(agp) if agp else "")
              return bump_gradle(need, why) if need else False


          # ───────────────────────── SDK / minSdk / NDK di app module ─────────────────────────
          RE_COMPILE = re.compile(r"(\bcompileSdk(?:Version)?\s*=?\s*)(flutter\.compileSdk(?:Version)?|(\d+))")
          RE_MIN = re.compile(r"(\bminSdk(?:Version)?\s*=?\s*)(flutter\.minSdk(?:Version)?|(\d+))")
          RE_NDK_FLUTTER = re.compile(r"(\bndkVersion\s*=?\s*)flutter\.ndkVersion")
          RE_NDK_LIT = re.compile(r"""(\bndkVersion\s*=?\s*["'])(\d+(?:\.\d+){1,3})(["'])""")


          def bump_compile(n):
              done = False
              for p in app_gradle_files():
                  t = rd(p)
                  nt = RE_COMPILE.sub(lambda m: m.group(0) if (m.group(3) and int(m.group(3)) >= n) else m.group(1) + str(n), t)
                  if nt != t:
                      wr(p, nt)
                      note(f"compileSdk -> {n} di {os.path.relpath(p, PROJECT)}")
                      done = True
              return done


          def bump_minsdk(n, flutter_default=0):
              done = False
              for p in app_gradle_files():
                  t = rd(p)

                  def rep(m):
                      if m.group(3):
                          return m.group(0) if int(m.group(3)) >= n else m.group(1) + str(n)
                      return m.group(0) if flutter_default >= n else m.group(1) + str(n)  # flutter.minSdkVersion

                  nt = RE_MIN.sub(rep, t)
                  if nt != t:
                      wr(p, nt)
                      note(f"minSdk -> {n} di {os.path.relpath(p, PROJECT)} (dibutuhkan plugin/library)")
                      done = True
              return done


          def set_ndk(version):
              done = False
              for p in app_gradle_files():
                  t = rd(p)
                  nt = RE_NDK_FLUTTER.sub(lambda m: m.group(1) + f'"{version}"', t)
                  nt = RE_NDK_LIT.sub(lambda m: m.group(0) if not lt(m.group(2), version) else m.group(1) + version + m.group(3), nt)
                  if nt != t:
                      wr(p, nt)
                      note(f"ndkVersion -> {version} di {os.path.relpath(p, PROJECT)}")
                      done = True
              return done


          # ───────────────────────── Flutter SDK ─────────────────────────
          def flutter_root():
              fr = os.environ.get("FLUTTER_ROOT", "")
              if not fr:
                  import shutil
                  fb = shutil.which("flutter")
                  fr = os.path.dirname(os.path.dirname(os.path.realpath(fb))) if fb else ""
              return fr


          def flutter_current():
              try:
                  out = subprocess.run(["flutter", "--version"], capture_output=True, text=True, timeout=120).stdout
                  m = re.search(r"Flutter\s+(\d+\.\d+\.\d+)", out)
                  return m.group(1) if m else ""
              except Exception:  # noqa
                  return ""


          def parse_kt_version(rhs):
              m = re.search(r"Version\(\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*(\d+))?\s*\)", rhs)
              if m:
                  return f"{m.group(1)}.{m.group(2)}.{m.group(3) or 0}"
              m = re.search(r"VERSION_(\d+)(?:_(\d+))?", rhs)
              if m:
                  return str(int(m.group(2)) if m.group(1) == "1" and m.group(2) else int(m.group(1)))
              return ""


          def cmd_reqs():
              froot = flutter_root()
              reqs = {"flutter": flutter_current()}
              gdir = os.path.join(froot, "packages", "flutter_tools", "gradle", "src", "main")
              if froot and os.path.isdir(gdir):
                  for dp, _, fns in os.walk(gdir):
                      for fn in fns:
                          t = rd(os.path.join(dp, fn)) if fn.endswith((".kt", ".groovy", ".gradle")) else ""
                          if not t:
                              continue
                          if fn == "DependencyVersionChecker.kt" or "DependencyVersionChecker" in t[:4000]:
                              for m in re.finditer(r"val\s+(error|warn)(Gradle|AGP|KGP|Java)Version\b[^=\n]*=\s*([^\n]+)", t):
                                  v = parse_kt_version(m.group(3))
                                  if v and m.group(1) == "error":
                                      reqs[{"Gradle": "gradle_min", "AGP": "agp_min", "KGP": "kgp_min", "Java": "java_min"}[m.group(2)]] = v
                          m = re.search(r"\bminSdkVersion\s*(?::\s*Int)?\s*=\s*(\d+)", t)
                          if m and "FlutterExtension" in (fn + t[:3000]):
                              reqs["flutter_min_sdk"] = int(m.group(1))
              jsave(REQS_JSON, reqs)
              print(f"Syarat minimum dari Flutter SDK {reqs.get('flutter') or '?'}: " + json.dumps({k: v for k, v in reqs.items() if k != 'flutter'}))
              tc = tc_load()
              if not tc:
                  return
              agp = vmax2(tc.get("agp", ""), reqs.get("agp_min", ""))
              gr = vmax2(tc.get("gradle_wrapper_version", ""), reqs.get("gradle_min", ""), D.gradle_for_agp(agp) if agp else "")
              need = D.choose_java(gr, agp, set(tc.get("jdk_req", [])), tc.get("flutter") or tc.get("flutter_alt"), os.environ.get("OVR_JAVA", ""))
              if reqs.get("java_min") and str(reqs["java_min"]).isdigit():
                  need = max(need, D.snap_jdk(int(reqs["java_min"])))
              if need > int(tc.get("java", 0) or 0):
                  warn(f"Flutter/AGP/Gradle yang dipakai butuh JDK {need} (sebelumnya {tc.get('java')}).")
                  tc["java"] = need
                  jsave(TC_JSON, tc)
                  D.out("java", need)


          def cmd_patch():
              reqs = jload(REQS_JSON, {})
              tc = tc_load()
              if not os.path.isdir(GRADLE_ROOT):
                  return
              agp, kgp = project_agp()
              if reqs.get("agp_min") and agp and lt(agp, reqs["agp_min"]):
                  bump_agp(reqs["agp_min"])
              if reqs.get("kgp_min") and kgp and lt(kgp, reqs["kgp_min"]):
                  bump_kgp(reqs["kgp_min"])
              ensure_gradle(reqs)
              pm = int(tc.get("plugin_min_sdk") or 0)
              if pm:
                  bump_minsdk(pm, int(reqs.get("flutter_min_sdk") or 21))
              ndks = tc.get("ndk") or []
              if len(ndks) > 1 and ENGINE == "flutter":
                  top = D.vmax(ndks)
                  if top:
                      set_ndk(top)  # plugin yang meminta NDK berbeda -> pakai yang tertinggi (kompatibel mundur)


          # ───────────────────────── heal reaktif ─────────────────────────
          ANSI = re.compile(r"\x1b\[[0-9;]*m")
          R_FLUTTER_MIN = re.compile(r"Your project's ([A-Za-z ]+?)(?: version)?\s*\([^)]*\)\s+is lower than Flutter's minimum supported version of\s+(?:[A-Za-z ]*?)(\d+(?:\.\d+){0,2})")
          R_AGP_GRADLE = [re.compile(r"Minimum supported Gradle version is (\d+(?:\.\d+)+)"),
                          re.compile(r"requires Gradle (?:version )?(\d+\.\d+(?:\.\d+)?) or (?:newer|higher)", re.I)]
          R_AGP_DEP = re.compile(r"requires\s+Android\s+Gradle\s+plugin\s+(\d+\.\d+(?:\.\d+)?)\s+or\s+higher")
          R_JAVA_N = [re.compile(r"requires Java (\d+) to run"), re.compile(r"requires at least JVM runtime version (\d+)"),
                      re.compile(r"Java Runtime \(class file version (\d+)\.\d\)")]
          R_JAVA_DOWN = re.compile(r"Unsupported class file major version \d+|JdkImageTransform|jlink|Unsupported Java\. Your build is currently configured to use Java")
          R_BT = re.compile(r"Failed to find Build Tools revision (\d[\w.\-]*)")
          R_TARGET = re.compile(r"Failed to find target with hash string 'android-([\w.\-]+)'")
          R_LICENSE = re.compile(r"Failed to install the following Android SDK packages as some licen[cs]es have not been accepted\.\s*((?:[ \t]+[\w\-]+;[^\n]*\n?)+)")
          R_NDK_VER = re.compile(r"No version of NDK matched the requested version (\d[\w.\-]*)")
          R_NDK_BAD = re.compile(r"NDK at (\S+?) did not have a source\.properties")
          R_NDK_ANY = re.compile(r"\[CXX1100\]|NDK is not installed|NDK not configured|Could not find the Android NDK|NDK.*(?:not found|missing)", re.I)
          R_CMAKE = re.compile(r"CMake '(\d[\d.]*)' was not found")
          R_COMPILE = re.compile(r"requires\s+libraries\s+and\s+applications\s+that\s+depend\s+on\s+it\s+to\s+compile\s+against\s+version\s+(\d+)\s+or\s+later")
          R_MINSDK = re.compile(r"minSdkVersion\s+(\d+)\s+cannot be smaller than version\s+(\d+)\s+declared in library")
          R_KMETA = re.compile(r"binary version of its metadata is (\d+)\.(\d+)\.\d+, expected version is")
          R_OOM = re.compile(r"OutOfMemoryError|GC overhead limit|Java heap space|Metaspace|Daemon will be stopped at the end of the build after running out of JVM memory")
          R_LINT = re.compile(r"lintVital\w*|Lint found fatal errors")
          R_R8 = re.compile(r"Missing classes detected while running R8|minify\w*WithR8|R8: |ProGuard")
          R_NS = re.compile(r"Namespace not specified\.[^\n]*?build file:\s*(\S+)")
          R_GSVC = re.compile(r"File google-services\.json is missing")
          R_PUB_DART = re.compile(r"requires SDK version (?:\^|>=)\s*(\d+\.\d+(?:\.\d+)?)")
          R_PUB_FLUTTER = re.compile(r"requires Flutter SDK version (?:\^|>=)\s*(\d+\.\d+(?:\.\d+)?)")
          R_NDK_WARN = re.compile(r"Fix this issue by using the highest Android NDK version[\s\S]{0,400}?ndkVersion\s*=?\s*\"(\d[\d.]+)\"")


          def java_major():
              try:
                  out = subprocess.run(["java", "-version"], capture_output=True, text=True, timeout=30)
                  m = re.search(r'version "(\d+)(?:\.(\d+))?', out.stderr + out.stdout)
                  if m:
                      return int(m.group(2)) if m.group(1) == "1" and m.group(2) else int(m.group(1))
              except Exception:  # noqa
                  pass
              return int(tc_load().get("java") or 17)


          def java_available(n):
              return bool(os.environ.get(f"JAVA_HOME_{n}_X64"))


          def pick_flutter(dneed, fneed, tried):
              """Flutter stable terendah (patch terbaru dari minor Dart terendah) yang memenuhi pubspec + kebutuhan baru."""
              pub = D.read(os.path.join(PROJECT, "pubspec.yaml"))
              env = D.pubspec_env(pub)
              dcons, fcons = D.parse_constraint(env["sdk"]), D.parse_constraint(env["flutter"])
              rels = D.load_releases()
              ok = [(f, d) for f, d in rels
                    if D.satisfies(d, dcons) and D.satisfies(f, fcons) and (not dneed or d >= dneed) and (not fneed or f >= fneed) and vstr(f) not in tried]
              if not ok:
                  return ""
              low = min(d[:2] for _, d in ok)
              return vstr(max(f for f, d in ok if d[:2] == low))


          def fix_namespace(path):
              path = path.strip().rstrip(".,")
              t = rd(path)
              if not t or re.search(r"\bnamespace\b", t):
                  return False
              mf = rd(os.path.join(os.path.dirname(path), "src", "main", "AndroidManifest.xml"))
              m = re.search(r'package\s*=\s*"([\w.]+)"', mf)
              ns = m.group(1) if m else "ci.plugin." + re.sub(r"\W", "_", os.path.basename(os.path.dirname(os.path.dirname(path))) or "mod")
              kts = path.endswith(".kts")
              nt = re.sub(r"(\bandroid\s*\{)", lambda mm: mm.group(1) + "\n    namespace" + (f' = "{ns}"' if kts else f' "{ns}"'), t, count=1)
              if nt != t:
                  wr(path, nt)
                  note(f"namespace '{ns}' ditambahkan ke {path}")
                  return True
              return False


          LINT_INIT = """// Dipasang CI saat lint menggagalkan build release
          allprojects { afterEvaluate { p ->
              def a = p.extensions.findByName('android')
              if (a != null) { try { a.lint.checkReleaseBuilds = false; a.lint.abortOnError = false; a.lint.checkDependencies = false } catch (Throwable t) {} }
          } }
          """


          def dummy_google_services():
              pkg = ""
              for p in app_gradle_files():
                  m = re.search(r"""\b(?:applicationId|namespace)\s*=?\s*["']([\w.]+)["']""", rd(p))
                  if m:
                      pkg = m.group(1)
                      break
              pkg = pkg or "com.example.app"
              dst = os.path.join(GRADLE_ROOT, "app", "google-services.json") if ENGINE == "flutter" else os.path.join(GRADLE_ROOT, "google-services.json")
              if os.path.exists(dst):
                  return False
              cfg = {"project_info": {"project_number": "000000000000", "project_id": "ci-placeholder", "storage_bucket": "ci-placeholder.appspot.com"},
                     "client": [{"client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": {"package_name": pkg}},
                                 "oauth_client": [], "api_key": [{"current_key": "AIzaSyCI000000000000000000000000000000"}],
                                 "services": {"appinvite_service": {"other_platform_oauth_client": []}}}], "configuration_version": "1"}
              jsave(dst, cfg)
              print(f"::warning::[compat] google-services.json tidak ada di project -> dibuat PLACEHOLDER (paket {pkg}) supaya build lolos. "
                    "Fitur Firebase (push, auth, dll.) TIDAK akan berfungsi sampai kamu menyertakan file asli dari Firebase Console.")
              return True


          def cmd_heal(logpath):
              raw = ""
              try:
                  with open(logpath, "rb") as f:
                      f.seek(0, 2)
                      f.seek(max(0, f.tell() - 600_000))
                      raw = f.read().decode("utf-8", errors="replace")
              except OSError:
                  pass
              log = ANSI.sub("", raw).replace("\r", "")
              state = set(jload(STATE_JSON, []))
              tc = tc_load()
              reqs = jload(REQS_JSON, {})
              env = {"HEAL_JAVA": "", "HEAL_SDK": [], "HEAL_FLUTTER": "", "HEAL_FLAGS": []}
              changed = []

              def once(key):
                  if key in state:
                      return False
                  state.add(key)
                  return True

              def done(msg):
                  changed.append(msg)
                  print(f"::notice::[heal] {msg}")

              # 1) syarat minimum Flutter (Gradle / AGP / Kotlin / Java)
              for m in R_FLUTTER_MIN.finditer(log):
                  what, ver = m.group(1).lower(), m.group(2)
                  if "gradle plugin" in what or what.strip() == "agp":
                      if once(f"agp:{ver}") and bump_agp(ver):
                          ensure_gradle(reqs, "AGP baru"); done(f"AGP dinaikkan ke {ver} (syarat Flutter)")
                  elif "gradle" in what:
                      if once(f"gradle:{ver}") and bump_gradle(ver, "syarat minimum Flutter"):
                          done(f"Gradle wrapper dinaikkan ke {norm_gradle(ver)} (syarat Flutter)")
                  elif "kotlin" in what:
                      if once(f"kgp:{ver}") and bump_kgp(ver):
                          done(f"Kotlin dinaikkan ke {ver} (syarat Flutter)")
                  elif "java" in what and ver.isdigit():
                      n = D.snap_jdk(int(ver))
                      if once(f"java:{n}") and java_available(n) and java_major() != n:
                          env["HEAL_JAVA"] = str(n); done(f"JDK diganti ke {n} (syarat Flutter)")
              # 2) AGP butuh Gradle lebih baru / dependency butuh AGP lebih baru
              for rx in R_AGP_GRADLE:
                  for m in rx.finditer(log):
                      if once(f"gradle:{m.group(1)}") and bump_gradle(m.group(1), "syarat AGP"):
                          done(f"Gradle wrapper dinaikkan ke {norm_gradle(m.group(1))} (syarat AGP)")
              for m in R_AGP_DEP.finditer(log):
                  if once(f"agp:{m.group(1)}") and bump_agp(m.group(1)):
                      ensure_gradle(reqs, "AGP baru"); done(f"AGP dinaikkan ke {m.group(1)} (syarat dependency)")
              # 3) JDK
              want = 0
              for rx in R_JAVA_N:
                  for m in rx.finditer(log):
                      n = int(m.group(1))
                      want = max(want, n - 44 if n >= 52 else n)  # class file version 65 -> Java 21
              cur = java_major()
              if want and D.snap_jdk(want) != cur and once(f"java:{D.snap_jdk(want)}") and java_available(D.snap_jdk(want)):
                  env["HEAL_JAVA"] = str(D.snap_jdk(want)); done(f"JDK diganti ke {env['HEAL_JAVA']} (dibutuhkan build)")
              elif not env["HEAL_JAVA"] and R_JAVA_DOWN.search(log) and cur > 17 and once("java:17") and java_available(17):
                  env["HEAL_JAVA"] = "17"; done(f"JDK {cur} tidak cocok dengan toolchain (jlink/class file) -> pakai JDK 17")
              # 4) paket Android SDK / NDK / CMake
              pk = []
              for m in R_BT.finditer(log): pk.append(f"build-tools;{m.group(1)}")
              for m in R_TARGET.finditer(log): pk.append(f"platforms;android-{m.group(1)}")
              for m in R_LICENSE.finditer(log):
                  pk += re.findall(r"^[ \t]+([\w\-]+;\S+)", m.group(1), re.M)
              for m in R_NDK_VER.finditer(log): pk.append(f"ndk;{m.group(1)}")
              for m in R_NDK_BAD.finditer(log):
                  d = m.group(1)
                  if os.path.isdir(d) and once(f"rmndk:{d}"):
                      import shutil
                      shutil.rmtree(d, ignore_errors=True)
                      pk.append(f"ndk;{os.path.basename(d.rstrip('/'))}")
              if not any(p.startswith("ndk;") for p in pk) and R_NDK_ANY.search(log):
                  pk += [f"ndk;{v}" for v in (tc.get("ndk") or [])]
              for m in R_CMAKE.finditer(log): pk.append(f"cmake;{m.group(1)}")
              # 5) compileSdk / minSdk / Kotlin metadata / NDK tertinggi
              cs = [int(m.group(1)) for m in R_COMPILE.finditer(log)]
              if cs and once(f"compile:{max(cs)}") and bump_compile(max(cs)):
                  pk.append(f"platforms;android-{max(cs)}"); done(f"compileSdk dinaikkan ke {max(cs)} (syarat dependency)")
              ms = [int(m.group(2)) for m in R_MINSDK.finditer(log)]
              if ms and once(f"minsdk:{max(ms)}") and bump_minsdk(max(ms), 0):
                  done(f"minSdk dinaikkan ke {max(ms)} (syarat library)")
              for m in R_KMETA.finditer(log):
                  v = f"{m.group(1)}.{m.group(2)}.0"
                  if once(f"kgp:{v}") and bump_kgp(v):
                      done(f"Kotlin dinaikkan ke {v} (metadata library lebih baru)")
              for m in R_NDK_WARN.finditer(log):
                  if once(f"ndk:{m.group(1)}") and set_ndk(m.group(1)):
                      pk.append(f"ndk;{m.group(1)}"); done(f"ndkVersion diseragamkan ke {m.group(1)}")
              pk = [p for p in dict.fromkeys(pk) if p and once(f"sdk:{p}")]
              if pk:
                  env["HEAL_SDK"] = pk; done("memasang paket SDK: " + ", ".join(pk))
              # 6) memori / lint / R8 / namespace / google-services
              if R_OOM.search(log) and once("oom"):
                  for gp in {os.path.join(GRADLE_ROOT, "gradle.properties")}:
                      t = rd(gp)
                      line = "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
                      t = re.sub(r"^\s*org\.gradle\.jvmargs\s*=.*$", line, t, flags=re.M) if re.search(r"^\s*org\.gradle\.jvmargs\s*=", t, re.M) else t.rstrip("\n") + "\n" + line + "\n"
                      wr(gp, t)
                  done("memori Gradle dinaikkan (-Xmx6g)")
              if R_LINT.search(log) and once("lint"):
                  wr(os.path.join(os.environ.get("GRADLE_USER_HOME") or os.path.join(HOME, ".gradle"), "init.d", "ci-lint.gradle"), LINT_INIT)
                  done("lint release dimatikan (init script)")
              if R_R8.search(log) and once("r8") and ENGINE == "flutter":
                  env["HEAL_FLAGS"].append("--no-shrink"); done("R8/ProGuard menggagalkan build -> build tanpa shrink (--no-shrink)")
              for m in R_NS.finditer(log):
                  if once(f"ns:{m.group(1)}") and fix_namespace(m.group(1)):
                      done("namespace modul ditambahkan")
              if R_GSVC.search(log) and once("gsvc") and dummy_google_services():
                  done("google-services.json placeholder dibuat")
              # 7) pub: SDK Dart/Flutter terlalu rendah
              dn = [D.vparse(m.group(1)) for m in R_PUB_DART.finditer(log)]
              fn = [D.vparse(m.group(1)) for m in R_PUB_FLUTTER.finditer(log)]
              if (dn or fn) and ENGINE == "flutter":
                  tried = {flutter_current()} | {k.split(":", 1)[1] for k in state if k.startswith("flutter:")}
                  v = pick_flutter(max(dn) if dn else None, max(fn) if fn else None, tried)
                  if v and once(f"flutter:{v}"):
                      env["HEAL_FLUTTER"] = v; done(f"Flutter {v} dipilih (dependency butuh Dart>={vstr(max(dn)) if dn else '-'})")

              jsave(STATE_JSON, sorted(state))
              lines = [f"HEAL_JAVA='{env['HEAL_JAVA']}'", f"HEAL_SDK='{' '.join(env['HEAL_SDK'])}'",
                       f"HEAL_FLUTTER='{env['HEAL_FLUTTER']}'", f"HEAL_FLAGS='{' '.join(env['HEAL_FLAGS'])}'"]
              wr(os.path.join(TMP, "heal.sh"), "\n".join(lines) + "\n")
              print(f"[heal] {len(changed)} perbaikan baru" + ("" if changed else " (tidak ada pola yang dikenali / sudah pernah dicoba)"))
              sys.exit(0 if changed else 1)


          def cmd_next_flutter(logpath, tried):
              log = ANSI.sub("", rd(logpath))
              dn = [D.vparse(m.group(1)) for m in R_PUB_DART.finditer(log)]
              fn = [D.vparse(m.group(1)) for m in R_PUB_FLUTTER.finditer(log)]
              tried = set(tried)
              v = pick_flutter(max(dn) if dn else None, max(fn) if fn else None, tried) if (dn or fn) else ""
              if not v:
                  for a in tc_load().get("flutter_alts") or []:
                      if a not in tried:
                          v = a
                          break
              print(v)


          if __name__ == "__main__":
              cmd = sys.argv[1] if len(sys.argv) > 1 else ""
              try:
                  if cmd == "reqs":
                      cmd_reqs()
                  elif cmd == "patch":
                      cmd_patch()
                  elif cmd == "heal":
                      cmd_heal(sys.argv[2])
                  elif cmd == "next-flutter":
                      cmd_next_flutter(sys.argv[2], sys.argv[3:])
                  else:
                      print(f"subcommand tidak dikenal: {cmd}")
              except SystemExit:
                  raise
              except Exception as e:  # noqa  (best-effort: jangan pernah menggagalkan workflow)
                  print(f"::warning::[compat] {cmd} dilewati karena error internal: {type(e).__name__}: {e}")
                  sys.exit(1 if cmd == "heal" else 0)
          __CI_EOF__

