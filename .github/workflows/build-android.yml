                echo "::warning::Tidak ada pola error yang dikenali. Mengulang sekali dengan state bersih + log verbose."
                (cd "$PRJ" && flutter clean >/dev/null 2>&1; run "flutter pub get (ulang)" flutter pub get) || true
                round=$((maxr - 2))
              else
                return 1
              fi
              round=$((round + 1))
            done
          }

          # ── Gradle wrapper otomatis (Flutter android/ & Android native) ────────────────
          # Bila gradlew / gradle-wrapper.jar / gradle-wrapper.properties tidak ada -> dibuat otomatis (seperti w2a_fix_wrapper di web2apk).
          ensure_wrapper() { # ensure_wrapper <gradleRoot>
            local root="$1" props jar ver="" url tmp gbin zipf
            [ -d "$root" ] || return 0
            props="$root/gradle/wrapper/gradle-wrapper.properties"; jar="$root/gradle/wrapper/gradle-wrapper.jar"
            sed -i 's/\r$//' "$props" 2>/dev/null || true
            if [ -f "$root/gradlew" ] && [ -s "$jar" ] && unzip -tqq "$jar" >/dev/null 2>&1; then
              sed -i 's/\r$//' "$root/gradlew"; chmod +x "$root/gradlew"; return 0
            fi
            echo "::warning::gradlew / gradle-wrapper.jar tidak lengkap di $root -> dibuat otomatis"
            ver="$(sed -nE 's/.*gradle-([0-9][0-9.]*)-(bin|all)\.zip.*/\1/p' "$props" 2>/dev/null | head -1)"
            [ -z "$ver" ] && ver="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("gradle") or "")' "$DIAG/toolchain.json" 2>/dev/null || true)"
            [ -z "$ver" ] && ver="8.10.2"
            tmp="$(mktemp -d)"
            gbin="$(command -v gradle || true)"
            if [ -z "$gbin" ]; then
              echo "gradle tidak ada di PATH -> mengunduh gradle-$ver"
              zipf="$tmp/g.zip"
              if curl -fsSL --retry 3 -o "$zipf" "https://services.gradle.org/distributions/gradle-$ver-bin.zip" && unzip -q -o "$zipf" -d "$tmp/dist"; then
                gbin="$(ls -d "$tmp"/dist/gradle-*/bin/gradle 2>/dev/null | head -1)"
              fi
            fi
            if [ -n "$gbin" ]; then
              mkdir -p "$tmp/w" && ( cd "$tmp/w" && "$gbin" wrapper --gradle-version "$ver" --distribution-type bin --no-daemon --console=plain >/dev/null 2>&1 ) || true
            fi
            if [ -s "$tmp/w/gradle/wrapper/gradle-wrapper.jar" ]; then
              mkdir -p "$root/gradle/wrapper"
              cp "$tmp/w/gradle/wrapper/gradle-wrapper.jar" "$jar"
              [ -f "$root/gradlew" ] || cp "$tmp/w/gradlew" "$root/gradlew"
              [ -f "$root/gradlew.bat" ] || cp "$tmp/w/gradlew.bat" "$root/gradlew.bat" 2>/dev/null || true
              if [ ! -f "$props" ]; then
                printf '%s\n' "distributionBase=GRADLE_USER_HOME" "distributionPath=wrapper/dists" \
                  "distributionUrl=https\\://services.gradle.org/distributions/gradle-$ver-bin.zip" \
                  "networkTimeout=180000" "zipStoreBase=GRADLE_USER_HOME" "zipStorePath=wrapper/dists" > "$props"
              fi
