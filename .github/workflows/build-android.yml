          }

          heal_apply() { # heal_apply <attempt.log> : 0 bila ada perbaikan BARU yang diterapkan
            rm -f "$HEAL_ENV"
            python3 "$RUNNER_TEMP/ci/compat.py" heal "$1" 2>&1 | tee -a "$LOG"
            [ "${PIPESTATUS[0]}" -eq 0 ] || return 1
            HEAL_JAVA=""; HEAL_SDK=""; HEAL_FLUTTER=""; HEAL_FLAGS=""
            # shellcheck disable=SC1090
            [ -f "$HEAL_ENV" ] && . "$HEAL_ENV"
            # shellcheck disable=SC2086
            [ -n "$HEAL_SDK" ] && { bash "$RUNNER_TEMP/ci/sdk.sh" install $HEAL_SDK 2>&1 | tail -20 | tee -a "$LOG"; }
            [ -n "$HEAL_JAVA" ] && use_java "$HEAL_JAVA"
            local f; for f in $HEAL_FLAGS; do EXTRA_FLAGS+=("$f"); done
            [ -n "$HEAL_FLUTTER" ] && NEXT_FLUTTER="$HEAL_FLUTTER"
            return 0
          }

          # ── Flutter ────────────────────────────────────────────────────────────────
          flutter_build() { # flutter_build <label> <v|n>
            local a=(build apk "--$TYPE" --no-pub)
            if [ "$PERF" = low ]; then a+=(--target-platform android-arm,android-arm64); else a+=(--target-platform android-arm64 --no-tree-shake-icons); fi
            [ -n "$FLAVOR" ] && a+=(--flavor "$FLAVOR")
            [ "${#EXTRA_FLAGS[@]}" -gt 0 ] && a+=("${EXTRA_FLAGS[@]}")
            [ "$2" = v ] && a+=(-v)
