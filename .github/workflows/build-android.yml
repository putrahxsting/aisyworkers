          }

          after_flutter_switch() { # setelah SDK Flutter diganti: pindai ulang plugin, syarat minimum, tambalan, komponen SDK, JDK
            (cd "$PRJ" && python3 "$RUNNER_TEMP/ci/detect.py" plugins) 2>&1 | tee -a "$LOG" || true
            python3 "$RUNNER_TEMP/ci/compat.py" reqs 2>&1 | tee -a "$LOG" || true
            python3 "$RUNNER_TEMP/ci/prepare.py" 2>&1 | tail -5 | tee -a "$LOG" || true
